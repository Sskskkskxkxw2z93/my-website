<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slate | Flashcards</title>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1C1C1E;
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-blue: #0A84FF;
            --accent-red: #FF453A;
            --accent-green: #30D158;
            --sidebar-width: 280px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            touch-action: manipulation;
        }

        /* AUTH */
        #auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            z-index: 10000;
            padding: 20px;
        }

        .auth-card { width: 100%; max-width: 340px; text-align: center; }

        .input-field {
            width: 100%;
            background: #1C1C1E;
            border: 1px solid var(--panel-border);
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            margin-bottom: 12px;
            outline: none;
        }

        /* APP */
        #app-screen {
            display: none;
            width: 100%;
            height: 100dvh;
            flex-direction: row;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: #000;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .sidebar.hidden {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .deck-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .deck-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 15px;
            color: #d1d1d6;
        }

        .deck-item:hover {
            background: rgba(255,255,255,0.05);
        }

        /* MAIN */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 20px;
        }

        .view-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* FLASHCARDS */
        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .card-surface {
            width: min(92vw, 520px);
            aspect-ratio: 4/3;
            background: #1C1C1E;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            font-size: clamp(18px, 4vw, 26px);
            border: 1px solid var(--panel-border);
            cursor: pointer;
        }

        /* EDITOR */
        .editor-box {
            background: #1C1C1E;
            border-radius: 16px;
            padding: 15px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            min-height: 100px;
            resize: none;
            outline: none;
        }

        .primary-btn {
            background: var(--accent-blue);
            color: white;
            padding: 16px;
            border-radius: 14px;
            border: none;
            width: 100%;
            font-weight: 600;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 1000;
                box-shadow: 20px 0 50px rgba(0,0,0,0.8);
            }

            .sidebar.hidden {
                transform: translateX(-100%);
                margin-left: 0;
            }

            .view-body {
                padding: 12px;
            }
        }

        .hidden-element { display: none !important; }

        button {
            touch-action: manipulation;
        }
    </style>
</head>

<body>

<!-- AUTH -->
<div id="auth-screen">
    <div class="auth-card">
        <h1>Slate</h1>
        <p style="color:#8E8E93; margin-bottom:20px;">Flashcards</p>

        <input id="email" class="input-field" placeholder="Email">
        <input id="password" class="input-field" type="password" placeholder="Password">

        <button class="primary-btn" id="auth-btn">Sign In</button>
        <p id="toggle" style="color:#0A84FF; margin-top:15px; cursor:pointer;">Create Account</p>
    </div>
</div>

<!-- APP -->
<div id="app-screen">

    <div id="sidebar" class="sidebar">
        <button id="add-deck">+ Deck</button>
        <div id="deck-list" class="deck-list"></div>
        <button id="logout" style="color:red; background:none; border:none;">Sign Out</button>
    </div>

    <div class="main-content">

        <div class="top-bar">
            <button id="toggle-sidebar">☰</button>
            <h2 id="title">Select Deck</h2>
        </div>

        <div class="view-body">

            <!-- ADD -->
            <div id="add-view">
                <div class="editor-box">
                    <textarea id="front" placeholder="Question"></textarea>
                    <textarea id="back" placeholder="Answer"></textarea>
                </div>
                <button class="primary-btn" id="save">Save</button>
            </div>

            <!-- STUDY -->
            <div id="study-view" class="hidden-element flashcard-container">
                <div class="card-surface" id="card">Tap</div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button id="again" style="flex:1;background:red;color:white;">Again</button>
                    <button id="good" style="flex:1;background:green;color:white;">Good</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDLn5hL02geNL0eMU5xXXUKkrLKA0QZhfs",
    authDomain: "slate-app-8fc4c.firebaseapp.com",
    projectId: "slate-app-8fc4c",
    storageBucket: "slate-app-8fc4c.firebasestorage.app",
    messagingSenderId: "1038552772007",
    appId: "1:1038552772007:web:855420f4f2181952cc9a82"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let login = true;
let deckId = null;
let cards = [];
let idx = 0;
let flipped = false;
let unsubscribeCards = null;

/* AUTH */
document.getElementById("toggle").onclick = () => {
    login = !login;
    document.getElementById("auth-btn").innerText = login ? "Sign In" : "Create Account";
};

document.getElementById("auth-btn").onclick = async () => {
    const email = email.value;
    const pass = password.value;

    try {
        if (login) await signInWithEmailAndPassword(auth, email, pass);
        else await createUserWithEmailAndPassword(auth, email, pass);
    } catch (e) {
        alert(e.message);
    }
};

onAuthStateChanged(auth, user => {
    if (user) {
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "flex";
        loadDecks();
    } else {
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app-screen").style.display = "none";
    }
});

/* DECKS */
function loadDecks() {
    const q = query(collection(db, `users/${auth.currentUser.uid}/decks`));

    onSnapshot(q, snap => {
        const list = document.getElementById("deck-list");
        list.innerHTML = "";

        snap.forEach(d => {
            const div = document.createElement("div");
            div.className = "deck-item";
            div.innerText = d.data().name;

            div.onclick = () => selectDeck(d.id, d.data().name);

            list.appendChild(div);
        });
    });
}

function selectDeck(id, name) {
    deckId = id;
    document.getElementById("title").innerText = name;

    if (unsubscribeCards) unsubscribeCards();

    unsubscribeCards = onSnapshot(
        collection(db, `users/${auth.currentUser.uid}/decks/${id}/cards`),
        snap => {
            cards = snap.docs.map(d => d.data());
        }
    );
}

/* SAVE CARD */
document.getElementById("save").onclick = async () => {
    await addDoc(
        collection(db, `users/${auth.currentUser.uid}/decks/${deckId}/cards`),
        {
            front: front.value,
            back: back.value,
            createdAt: serverTimestamp()
        }
    );

    front.value = "";
    back.value = "";
};

/* STUDY */
document.getElementById("card").onclick = () => {
    if (!cards.length) return;

    flipped = !flipped;
    document.getElementById("card").innerText =
        flipped ? cards[idx].back : cards[idx].front;
};

document.getElementById("good").onclick = next;
document.getElementById("again").onclick = next;

function next() {
    idx++;
    flipped = false;

    if (idx >= cards.length) {
        idx = 0;
    }

    render();
}

function render() {
    if (!cards.length) {
        document.getElementById("card").innerText = "No cards";
        return;
    }

    document.getElementById("card").innerText = cards[idx].front;
}

/* UI */
document.getElementById("toggle-sidebar").onclick = () => {
    document.getElementById("sidebar").classList.toggle("hidden");
};

document.getElementById("add-deck").onclick = async () => {
    const name = prompt("Deck name:");
    if (!name) return;

    await addDoc(collection(db, `users/${auth.currentUser.uid}/decks`), {
        name,
        createdAt: serverTimestamp()
    });
};

document.getElementById("logout").onclick = () => signOut(auth);

</script>
</body>
</html>
