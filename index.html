<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slate — Flashcards</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    background: #0f0f10;
    color: white;
  }

  header {
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    background: #151518;
  }

  .container {
    padding: 16px;
  }

  .card {
    background: #1c1c20;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 12px;
  }

  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 8px;
    width: 100%;
  }

  button {
    background: #4f7cff;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #3d66d6;
  }
</style>
</head>

<body>

<header>Slate — Flashcards</header>

<div class="container">

  <div class="card">
    <h3>Create Flashcard</h3>
    <input id="question" placeholder="Question" />
    <input id="answer" placeholder="Answer" />
    <button id="addBtn">Add Card</button>
  </div>

  <div id="cards"></div>

</div>

<script type="module">
/* ================= FIREBASE SETUP ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLn5hL02geNL0eMU5xXXUKkrLKA0QZhfs",
  authDomain: "slate-app-8fc4c.firebaseapp.com",
  projectId: "slate-app-8fc4c",
  storageBucket: "slate-app-8fc4c.firebasestorage.app",
  messagingSenderId: "1038552772007",
  appId: "1:1038552772007:web:855420f4f2181952cc9a82",
  measurementId: "G-V8ZPJLT501"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

/* ================= APP LOGIC ================= */

const cardsDiv = document.getElementById("cards");
const addBtn = document.getElementById("addBtn");

async function loadCards() {
  cardsDiv.innerHTML = "";
  const snapshot = await getDocs(collection(db, "flashcards"));

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>Q:</strong> ${data.question}<br/>
      <strong>A:</strong> ${data.answer}
    `;

    cardsDiv.appendChild(div);
  });
}

addBtn.addEventListener("click", async () => {
  const q = document.getElementById("question").value;
  const a = document.getElementById("answer").value;

  if (!q || !a) return;

  await addDoc(collection(db, "flashcards"), {
    question: q,
    answer: a,
    createdAt: Date.now()
  });

  document.getElementById("question").value = "";
  document.getElementById("answer").value = "";

  loadCards();
});

loadCards();
</script>

</body>
</html>
