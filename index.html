<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate | Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .apple-btn {
            transition: all 0.2s ease;
        }
        .apple-btn:active {
            transform: scale(0.98);
            opacity: 0.8;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }
        .input-field:focus {
            border-color: #007AFF;
            outline: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-b from-[#1c1c1e] to-black">
        <div class="glass w-full max-w-md p-8 rounded-[2rem] shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <div class="w-12 h-12 bg-white rounded-full mb-4"></div>
                <h2 class="text-2xl font-semibold tracking-tight">Welcome back</h2>
                <p class="text-gray-400 text-sm mt-1">Sign in to access your flashcards.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Email</label>
                    <input type="email" id="email" class="input-field w-full p-4 rounded-xl mt-1" placeholder="you@school.edu">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Password</label>
                    <input type="password" id="password" class="input-field w-full p-4 rounded-xl mt-1" placeholder="••••••••">
                </div>
                <button onclick="handleAuth('login')" class="apple-btn w-full bg-[#007AFF] hover:bg-[#0a84ff] text-white font-medium py-4 rounded-xl mt-4">Sign in</button>
                <div class="text-center mt-6">
                    <span class="text-gray-500 text-sm">New here? </span>
                    <button onclick="handleAuth('signup')" class="text-[#007AFF] text-sm font-medium hover:underline">Create an account</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden min-h-screen flex">
        <aside class="w-64 glass border-r border-white/10 p-6 flex flex-col">
            <h1 class="text-xl font-semibold mb-8 flex items-center gap-2">
                <i data-lucide="layers" class="w-5 h-5 text-[#007AFF]"></i> Slate
            </h1>
            <nav class="space-y-2 flex-1">
                <div class="bg-[#007AFF]/10 text-[#007AFF] p-3 rounded-lg flex items-center gap-3 cursor-pointer">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    <span class="text-sm font-medium">All Decks</span>
                </div>
                <div class="text-gray-400 p-3 rounded-lg flex items-center gap-3 hover:bg-white/5 cursor-pointer">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    <span class="text-sm font-medium">Folders</span>
                </div>
            </nav>
            <button onclick="logout()" class="text-gray-500 text-xs hover:text-white flex items-center gap-2">
                <i data-lucide="log-out" class="w-3 h-3"></i> Sign Out
            </button>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Library</p>
                    <h2 class="text-3xl font-bold">All decks</h2>
                </div>
                <button onclick="toggleModal('deck-modal')" class="apple-btn bg-[#007AFF] px-5 py-2.5 rounded-full flex items-center gap-2 text-sm font-medium">
                    <i data-lucide="plus" class="w-4 h-4"></i> New deck
                </button>
            </header>

            <div id="decks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <div id="deck-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-8 rounded-3xl">
            <h3 class="text-xl font-semibold mb-6">New deck</h3>
            <input type="text" id="deck-name" class="input-field w-full p-4 rounded-xl mb-4" placeholder="Deck name (e.g. Organic Chemistry)">
            <textarea id="deck-desc" class="input-field w-full p-4 rounded-xl mb-6 h-24" placeholder="Description (optional)"></textarea>
            <div class="flex justify-end gap-4">
                <button onclick="toggleModal('deck-modal')" class="text-gray-400 px-4 py-2">Cancel</button>
                <button onclick="createDeck()" class="apple-btn bg-[#007AFF] px-6 py-2 rounded-full font-medium">Create deck</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLn5hL02geNL0eMU5xXXUKkrLKA0QZhfs",
            authDomain: "slate-app-8fc4c.firebaseapp.com",
            projectId: "slate-app-8fc4c",
            storageBucket: "slate-app-8fc4c.firebasestorage.app",
            messagingSenderId: "1038552772007",
            appId: "1:1038552772007:web:855420f4f2181952cc9a82",
            measurementId: "G-V8ZPJLT501"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let currentUser = null;

        // Auth Handler
        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (type === 'signup') await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth);

        // UI Toggle
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadDecks();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        // Firestore Logic
        window.createDeck = async () => {
            const name = document.getElementById('deck-name').value;
            const desc = document.getElementById('deck-desc').value;
            if (!name) return;

            await addDoc(collection(db, `users/${currentUser.uid}/decks`), {
                name, desc, createdAt: Date.now()
            });
            toggleModal('deck-modal');
        };

        function loadDecks() {
            const q = query(collection(db, `users/${currentUser.uid}/decks`));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('decks-container');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="glass p-6 rounded-3xl hover:border-[#007AFF]/50 transition-all cursor-pointer group">
                            <h4 class="text-xl font-semibold mb-1">${data.name}</h4>
                            <p class="text-gray-500 text-sm mb-6">${data.desc || 'No description'}</p>
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-bold text-gray-600 uppercase tracking-tighter">0 Cards</span>
                                <div class="flex gap-2">
                                    <button class="bg-[#007AFF] text-xs px-4 py-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">Study</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        lucide.createIcons();
    </script>
</body>
</html>
