<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlashDeck</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111113;
    --surface: #1a1a1d;
    --surface2: #212125;
    --surface3: #2a2a2f;
    --border: #2e2e34;
    --border2: #3a3a42;
    --accent: #e8e8f0;
    --accent-dim: rgba(232,232,240,0.12);
    --wrong: #d96c6c;
    --wrong-dim: rgba(217,108,108,0.12);
    --correct: #6cbf8e;
    --correct-dim: rgba(108,191,142,0.12);
    --text: #ededf0;
    --text2: #8a8a96;
    --text3: #4e4e58;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  /* LAYOUT */
  .app { display: flex; height: 100vh; height: 100dvh; }
  .sidebar {
    width: 260px; min-width: 260px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    z-index: 10;
  }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* SIDEBAR HEADER */
  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); letter-spacing: -0.3px; }
  .sidebar-actions { margin-left: auto; display: flex; gap: 5px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }

  /* FOLDER LIST */
  .folder-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .folder-list::-webkit-scrollbar { width: 3px; }
  .folder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .folder-item { border-radius: var(--radius-sm); margin-bottom: 1px; }
  .folder-header {
    display: flex; align-items: center; gap: 8px; padding: 8px 9px;
    cursor: pointer; border-radius: var(--radius-sm); user-select: none;
    transition: background 0.12s;
  }
  .folder-header:hover { background: var(--surface2); }
  .folder-icon-text { font-size: 11px; color: var(--text3); flex-shrink: 0; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .folder-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .folder-meta { font-size: 11px; color: var(--text3); flex-shrink: 0; }
  .folder-chevron { font-size: 9px; color: var(--text3); flex-shrink: 0; transition: transform 0.18s; }
  .folder-chevron.open { transform: rotate(90deg); }
  .folder-dots { opacity: 0; transition: opacity 0.12s; flex-shrink: 0; cursor: pointer; font-size: 15px; color: var(--text3); padding: 2px 3px; border-radius: 4px; line-height: 1; }
  .folder-header:hover .folder-dots { opacity: 1; }
  .folder-dots:hover { background: var(--surface3); color: var(--text); }

  /* DECK LIST */
  .deck-list { padding-left: 22px; overflow: hidden; }
  .deck-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 1px;
    transition: background 0.12s;
  }
  .deck-item:hover { background: var(--surface2); }
  .deck-item.active { background: var(--accent-dim); }
  .deck-item.active .deck-name { color: var(--text); }
  .deck-name { font-size: 13px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text2); }
  .deck-count { font-size: 11px; color: var(--text3); flex-shrink: 0; }
  .deck-dots { opacity: 0; transition: opacity 0.12s; flex-shrink: 0; cursor: pointer; font-size: 14px; color: var(--text3); padding: 2px 3px; border-radius: 4px; line-height: 1; }
  .deck-item:hover .deck-dots { opacity: 1; }
  .deck-dots:hover { background: var(--surface3); color: var(--text); }
  .review-deck-item { color: var(--text3); font-size: 12px; }

  /* MAIN HEADER */
  .main-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    min-height: 56px;
  }
  .menu-btn { display: none; }
  .main-title { font-family: 'DM Serif Display', serif; font-size: 20px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; gap: 7px; flex-shrink: 0; }

  .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.12s; display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:hover { background: var(--accent); opacity: 0.9; }
  .btn-secondary { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-secondary:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .btn-danger { background: transparent; color: var(--wrong); border-color: rgba(217,108,108,0.3); }
  .btn-danger:hover { background: var(--wrong-dim); }

  /* MAIN CONTENT */
  .main-content { flex: 1; overflow-y: auto; padding: 20px; }
  .main-content::-webkit-scrollbar { width: 3px; }
  .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* HOME VIEW */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; text-align: center;
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }

  .section-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }

  .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .deck-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: border-color 0.15s, transform 0.15s;
  }
  .deck-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .deck-card-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .deck-card-meta { font-size: 12px; color: var(--text3); }
  .deck-card-review { font-size: 11px; color: var(--wrong); margin-top: 7px; }

  /* REVIEW SECTION on home */
  .review-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 22px;
  }
  .review-section-title { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .review-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .review-pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 100px; padding: 4px 11px; font-size: 12px; color: var(--text2);
    cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .review-pill:hover { background: var(--surface3); color: var(--text); }
  .review-pill strong { color: var(--wrong); }

  /* DECK VIEW — simple card list */
  .deck-card-list { display: flex; flex-direction: column; gap: 8px; }
  .deck-card-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
  }
  .dcr-num { font-size: 12px; color: var(--text3); width: 24px; flex-shrink: 0; padding-top: 2px; }
  .dcr-body { flex: 1; }
  .dcr-q { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
  .dcr-a { font-size: 13px; color: var(--text2); }
  .dcr-review { font-size: 11px; color: var(--wrong); margin-top: 5px; }

  /* EDIT VIEW */
  .edit-toolbar { display: flex; gap: 7px; margin-bottom: 16px; flex-wrap: wrap; }
  .card-list-edit { display: flex; flex-direction: column; gap: 8px; }
  .card-edit-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; gap: 10px; align-items: flex-start;
    transition: border-color 0.12s;
  }
  .card-edit-item:hover { border-color: var(--border2); }
  .card-num { font-size: 12px; color: var(--text3); font-weight: 600; width: 24px; flex-shrink: 0; padding-top: 11px; text-align: center; }
  .card-fields { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .card-field {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; padding: 9px 11px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; resize: none; outline: none; transition: border-color 0.12s; min-height: 40px;
  }
  .card-field:focus { border-color: var(--border2); }
  .card-field::placeholder { color: var(--text3); }
  .card-delete-btn {
    background: transparent; border: none; color: var(--text3); cursor: pointer;
    font-size: 14px; padding: 5px; border-radius: 5px; flex-shrink: 0; margin-top: 7px;
  }
  .card-delete-btn:hover { color: var(--wrong); background: var(--wrong-dim); }

  /* STUDY VIEW */
  .study-view { max-width: 600px; margin: 0 auto; }
  .progress-wrap { background: var(--surface2); border-radius: 100px; height: 3px; margin-bottom: 22px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text); border-radius: 100px; transition: width 0.35s cubic-bezier(.4,0,.2,1); }
  .card-counter { text-align: center; font-size: 12px; color: var(--text3); margin-bottom: 18px; letter-spacing: 0.04em; }
  .card-counter span { color: var(--text2); font-weight: 600; }

  .flashcard-wrap { perspective: 1200px; margin-bottom: 24px; cursor: pointer; }
  .flashcard-inner { position: relative; transition: transform 0.55s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
  .flashcard-inner.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 44px 32px; min-height: 220px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .flashcard-back {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    transform: rotateY(180deg);
    border-color: var(--border2);
  }
  .card-hint { font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .card-text { font-family: 'DM Serif Display', serif; font-size: 24px; line-height: 1.45; color: var(--text); }
  .card-text-answer { font-size: 19px; line-height: 1.5; }

  .study-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .answer-btn {
    padding: 14px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid;
    transition: all 0.12s; display: flex; align-items: center; justify-content: center;
  }
  .btn-wrong { background: var(--wrong-dim); border-color: rgba(217,108,108,0.4); color: var(--wrong); }
  .btn-wrong:hover { background: rgba(217,108,108,0.2); }
  .btn-correct { background: var(--correct-dim); border-color: rgba(108,191,142,0.4); color: var(--correct); }
  .btn-correct:hover { background: rgba(108,191,142,0.22); }

  .study-nav { display: flex; gap: 8px; justify-content: center; }

  /* SESSION COMPLETE */
  .session-complete { text-align: center; padding: 48px 20px; max-width: 400px; margin: 0 auto; }
  .session-title { font-family: 'DM Serif Display', serif; font-size: 30px; margin-bottom: 6px; }
  .session-sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .result-num { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .result-label { font-size: 11px; color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .session-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* CONTEXT MENU */
  .ctx-menu {
    position: fixed; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 5px; min-width: 152px;
    box-shadow: var(--shadow); z-index: 1000; display: none;
    animation: fadeIn 0.1s ease;
  }
  .ctx-menu.open { display: block; }
  .ctx-item {
    padding: 7px 11px; border-radius: 5px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; color: var(--text);
    transition: background 0.1s;
  }
  .ctx-item:hover { background: var(--surface2); }
  .ctx-item.danger { color: var(--wrong); }
  .ctx-item.danger:hover { background: var(--wrong-dim); }
  .ctx-divider { height: 1px; background: var(--border); margin: 3px 0; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    z-index: 500; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.18s;
    padding: 20px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px; width: 100%; max-width: 400px;
    transform: translateY(16px); transition: transform 0.18s;
    box-shadow: var(--shadow);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
  .modal-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 13px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
    transition: border-color 0.12s; margin-bottom: 8px;
  }
  .modal-input:focus { border-color: var(--border2); }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 56px 20px; color: var(--text2); }
  .empty-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); margin-bottom: 7px; }
  .empty-sub { font-size: 13px; line-height: 1.6; color: var(--text3); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 100px;
    padding: 9px 18px; font-size: 13px; font-weight: 500; z-index: 900;
    transition: transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s;
    opacity: 0; box-shadow: var(--shadow); white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* LOADING */
  .loading-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    z-index: 999; gap: 14px;
  }
  .loading-logo { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--text); }
  .loading-dots { display: flex; gap: 5px; }
  .loading-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: pulse 1.2s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  /* BREADCRUMB */
  .breadcrumb { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 1px; }
  .breadcrumb-link { cursor: pointer; transition: color 0.12s; }
  .breadcrumb-link:hover { color: var(--text2); }
  .breadcrumb-sep { color: var(--text3); }
  .breadcrumb-current { color: var(--text2); }

  /* MOBILE OVERLAY */
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9; }

  @keyframes pulse { 0%,100%{opacity:0.25;transform:scale(0.8)} 50%{opacity:0.7;transform:scale(1)} }
  @keyframes fadeIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%);
      width: 260px; z-index: 10;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { display: block; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
    .sidebar-overlay.open { pointer-events: all; opacity: 1; }
    .menu-btn { display: flex; }
    .main-content { padding: 14px; }
    .stats-row { gap: 8px; }
    .deck-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .flashcard-face { padding: 32px 22px; min-height: 190px; }
    .card-text { font-size: 21px; }
  }
  @media (max-width: 430px) {
    .stat-num { font-size: 24px; }
    .deck-grid { grid-template-columns: 1fr 1fr; }
    .flashcard-face { padding: 26px 18px; min-height: 170px; }
    .card-text { font-size: 18px; }
    .study-actions { gap: 8px; }
    .answer-btn { padding: 13px; font-size: 13px; }
    .main-header { padding: 11px 14px; }
    .main-content { padding: 12px; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">FlashDeck</div>
  <div class="loading-dots">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">FlashDeck</div>
      <div class="sidebar-actions">
        <button class="icon-btn" title="New Folder" onclick="openNewFolderModal()">+ Folder</button>
        <button class="icon-btn" title="New Deck" onclick="openNewDeckModal()">+ Deck</button>
      </div>
    </div>
    <div class="folder-list" id="folderList"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--border)">
      <div id="authArea"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <button class="icon-btn menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <div style="flex:1;min-width:0">
        <div class="main-title" id="mainTitle">FlashDeck</div>
        <div class="breadcrumb" id="breadcrumb"></div>
      </div>
      <div class="header-actions" id="headerActions"></div>
    </div>
    <div class="main-content" id="mainContent"></div>
  </main>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu"><div id="ctxItems"></div></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOuter(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDk2Np8D7FkcTLLtR3sY0JRvRXrsi58ZDY",
  authDomain: "tune-6a7b5.firebaseapp.com",
  projectId: "tune-6a7b5",
  storageBucket: "tune-6a7b5.firebasestorage.app",
  messagingSenderId: "14662217624",
  appId: "1:14662217624:web:54746870d24713bc9705ed",
  measurementId: "G-9H0VMN285L"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

// ── STATE ──────────────────────────────────────────────────────────────
let state = {
  uid: null,
  folders: [],
  decks: [],
  currentView: 'home',
  currentDeckId: null,
  currentCardIndex: 0,
  cardFlipped: false,
  sessionResults: { correct: 0, wrong: 0 },
  studyCards: [],
};

// ── AUTH ───────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (user) {
    state.uid = user.uid;
    document.getElementById('authArea').innerHTML =
      `<div style="font-size:11px;color:var(--text3);text-align:center">Synced &middot; ${user.uid.slice(0,8)}&hellip;</div>`;
    await loadData();
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    renderSidebar();
    showHome();
  } else {
    await signInAnonymously(auth);
  }
});

// ── FIRESTORE ──────────────────────────────────────────────────────────
async function loadData() {
  try {
    const snap = await getDoc(doc(db, 'users', state.uid));
    if (snap.exists()) {
      const d = snap.data();
      state.folders = d.folders || [];
      state.decks   = d.decks   || [];
    } else {
      state.folders = [
        {id: uid(), name: 'Biology', order: 0},
        {id: uid(), name: 'History', order: 1},
      ];
      const f1 = state.folders[0].id, f2 = state.folders[1].id;
      state.decks = [
        {id: uid(), name: 'Cell Structure', folderId: f1, order: 0,
          cards: [
            {id: uid(), q:'What is the powerhouse of the cell?', a:'Mitochondria', wrongCount:2},
            {id: uid(), q:'What controls what enters and exits the cell?', a:'Cell membrane', wrongCount:0},
            {id: uid(), q:'Which organelle contains DNA?', a:'Nucleus', wrongCount:1},
            {id: uid(), q:'What produces proteins?', a:'Ribosome', wrongCount:0},
          ]
        },
        {id: uid(), name: 'Photosynthesis', folderId: f1, order: 1,
          cards: [
            {id: uid(), q:'What pigment captures sunlight?', a:'Chlorophyll', wrongCount:0},
            {id: uid(), q:'What gas is released during photosynthesis?', a:'Oxygen', wrongCount:1},
          ]
        },
        {id: uid(), name: 'WWI Causes', folderId: f2, order: 0,
          cards: [
            {id: uid(), q:'What was the main alliance opposing the Triple Entente?', a:'The Triple Alliance', wrongCount:3},
            {id: uid(), q:'Assassination of which Archduke triggered WWI?', a:'Archduke Franz Ferdinand', wrongCount:0},
          ]
        },
      ];
      await saveData();
    }
  } catch(e) { console.error(e); showToast('Could not load data'); }
}

async function saveData() {
  try {
    await setDoc(doc(db, 'users', state.uid), {
      folders: state.folders,
      decks: state.decks,
      updatedAt: Date.now()
    });
  } catch(e) { console.error(e); showToast('Sync error'); }
}

function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

// ── SIDEBAR ────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('folderList');
  const sorted = [...state.folders].sort((a,b) => a.order - b.order);
  list.innerHTML = '';

  if (!sorted.length) {
    list.innerHTML = `<div style="padding:18px;text-align:center;color:var(--text3);font-size:13px">No folders yet.</div>`;
    return;
  }

  sorted.forEach(folder => {
    const folderDecks = state.decks.filter(d => d.folderId === folder.id).sort((a,b) => a.order - b.order);
    const hasWrong = folderDecks.some(d => d.cards.some(c => c.wrongCount > 0));
    const isOpen = folder._open !== false;
    const wrongCount = folderDecks.reduce((s,d)=>s+d.cards.filter(c=>c.wrongCount>0).length, 0);

    const item = document.createElement('div');
    item.className = 'folder-item';
    item.dataset.folderId = folder.id;

    item.innerHTML = `
      <div class="folder-header" onclick="toggleFolder('${folder.id}')">
        <span class="folder-chevron ${isOpen?'open':''}" id="chev-${folder.id}">&#9658;</span>
        <span class="folder-name">${esc(folder.name)}</span>
        <span class="folder-meta">${folderDecks.length}</span>
        <span class="folder-dots" onclick="openFolderMenu(event,'${folder.id}')">&#8943;</span>
      </div>
      <div class="deck-list" id="dl-${folder.id}" style="display:${isOpen?'block':'none'}">
        ${folderDecks.map(deck => {
          const isActive = state.currentDeckId === deck.id;
          return `
            <div class="deck-item ${isActive?'active':''}" id="di-${deck.id}" onclick="selectDeck('${deck.id}')">
              <span class="deck-name">${esc(deck.name)}</span>
              <span class="deck-count">${deck.cards.length}</span>
              <span class="deck-dots" onclick="openDeckMenu(event,'${deck.id}')">&#8943;</span>
            </div>`;
        }).join('')}
        ${hasWrong ? `
          <div class="deck-item review-deck-item" onclick="studyWrongDeck('${folder.id}')">
            <span class="deck-name" style="color:var(--text3);font-size:12px">Review incorrect &middot; ${wrongCount}</span>
          </div>` : ''}
      </div>`;
    list.appendChild(item);
  });
}

function toggleFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  folder._open = folder._open === false ? true : false;
  const dl = document.getElementById('dl-'+id);
  const chev = document.getElementById('chev-'+id);
  if (dl) dl.style.display = folder._open === false ? 'none' : 'block';
  if (chev) chev.classList.toggle('open', folder._open !== false);
}

// ── HOME ───────────────────────────────────────────────────────────────
function showHome() {
  state.currentView = 'home';
  state.currentDeckId = null;
  document.getElementById('mainTitle').textContent = 'FlashDeck';
  document.getElementById('breadcrumb').innerHTML = '';
  document.getElementById('headerActions').innerHTML = `
    <button class="btn btn-secondary" onclick="openNewFolderModal()">+ Folder</button>
    <button class="btn btn-primary" onclick="openNewDeckModal()">+ Deck</button>`;

  const totalCards = state.decks.reduce((s,d)=>s+d.cards.length, 0);
  const totalDecks = state.decks.length;
  const totalWrong = state.decks.reduce((s,d)=>s+d.cards.filter(c=>c.wrongCount>0).length, 0);

  // Review section
  let reviewSection = '';
  const wrongDecks = state.decks.filter(d => d.cards.some(c=>c.wrongCount>0));
  if (wrongDecks.length) {
    const pills = wrongDecks.map(d => {
      const w = d.cards.filter(c=>c.wrongCount>0).length;
      return `<div class="review-pill" onclick="studyDeckById('${d.id}',true)">${esc(d.name)} <strong>${w}</strong></div>`;
    }).join('');
    reviewSection = `<div class="review-section"><div class="review-section-title">To Review</div><div class="review-pills">${pills}</div></div>`;
  }

  // Folder sections
  const sorted = [...state.folders].sort((a,b)=>a.order-b.order);
  const folderSections = sorted.map(folder => {
    const decks = state.decks.filter(d=>d.folderId===folder.id).sort((a,b)=>a.order-b.order);
    if (!decks.length) return '';
    const cards = decks.map(deck => {
      const w = deck.cards.filter(c=>c.wrongCount>0).length;
      return `
        <div class="deck-card" onclick="selectDeck('${deck.id}')">
          <div class="deck-card-name">${esc(deck.name)}</div>
          <div class="deck-card-meta">${deck.cards.length} cards</div>
          ${w ? `<div class="deck-card-review">${w} to review</div>` : ''}
        </div>`;
    }).join('');
    return `<div style="margin-bottom:24px">
      <div class="section-label">${esc(folder.name)}</div>
      <div class="deck-grid">${cards}</div>
    </div>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num">${totalDecks}</div><div class="stat-label">Decks</div></div>
        <div class="stat-card"><div class="stat-num">${totalCards}</div><div class="stat-label">Cards</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--wrong)">${totalWrong}</div><div class="stat-label">Review</div></div>
      </div>
      ${reviewSection}
      ${folderSections || `<div class="empty-state"><div class="empty-title">No decks yet</div><div class="empty-sub">Create a folder, then add a deck to get started.</div></div>`}
    </div>`;

  renderSidebar();
  closeSidebar();
}

// ── SELECT DECK ────────────────────────────────────────────────────────
function selectDeck(deckId) {
  const deck = state.decks.find(d=>d.id===deckId);
  if (!deck) return;
  state.currentDeckId = deckId;
  state.currentView = 'deck';
  const folder = state.folders.find(f=>f.id===deck.folderId);

  document.getElementById('mainTitle').textContent = deck.name;
  document.getElementById('breadcrumb').innerHTML = `
    <span class="breadcrumb-link" onclick="showHome()">Home</span>
    <span class="breadcrumb-sep">&#8250;</span>
    <span class="breadcrumb-link" onclick="showHome()">${esc(folder?.name||'')}</span>
    <span class="breadcrumb-sep">&#8250;</span>
    <span class="breadcrumb-current">${esc(deck.name)}</span>`;

  document.getElementById('headerActions').innerHTML = `
    <button class="btn btn-secondary" id="btn-view" onclick="showDeckCards()">Cards</button>
    <button class="btn btn-secondary" id="btn-edit" onclick="showEditDeck()">Edit</button>
    <button class="btn btn-primary" onclick="startStudy('${deckId}',false)">Study</button>`;

  showDeckCards();
  renderSidebar();
  closeSidebar();
}

// ── DECK CARDS VIEW ────────────────────────────────────────────────────
function showDeckCards() {
  setHeaderActive('btn-view');
  const deck = state.decks.find(d=>d.id===state.currentDeckId);

    <div style="max-width:580px;margin:0 auto">
      <div class="deck-card-list">
        ${deck.cards.map((c,i) => `
          <div class="deck-card-row">
            <div class="dcr-num">${i+1}</div>
            <div class="dcr-body">
              <div class="dcr-q">${esc(c.q)}</div>
              <div class="dcr-a">${esc(c.a)}</div>
              ${c.wrongCount > 0 ? `<div class="dcr-review">${c.wrongCount}x incorrect</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

// ── EDIT DECK VIEW ─────────────────────────────────────────────────────
function showEditDeck() {
  setHeaderActive('btn-edit');
  const deck = state.decks.find(d=>d.id===state.currentDeckId);
  if (!deck) return;

  document.getElementById('mainContent').innerHTML = `
    <div style="max-width:580px;margin:0 auto">
      <div class="edit-toolbar">
        <button class="btn btn-secondary" onclick="addCard()">+ Add Card</button>
        <button class="btn btn-primary" onclick="saveDeckEdits()">Save</button>
        <button class="btn btn-danger" onclick="confirmDeleteDeck('${deck.id}')">Delete Deck</button>
      </div>
      <div class="card-list-edit" id="editCardList">
        ${deck.cards.map((c,i) => `
          <div class="card-edit-item" data-card-id="${c.id}">
            <div class="card-num">${i+1}</div>
            <div class="card-fields">
              <textarea class="card-field" placeholder="Question" data-type="q" data-id="${c.id}" rows="2">${esc(c.q)}</textarea>
              <textarea class="card-field" placeholder="Answer" data-type="a" data-id="${c.id}" rows="2">${esc(c.a)}</textarea>
            </div>
            <button class="card-delete-btn" onclick="deleteCard('${c.id}')">&#10005;</button>
          </div>`).join('')}
      </div>
    </div>`;

  document.querySelectorAll('.card-field').forEach(ta => {
    ta.style.height = ta.scrollHeight + 'px';
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  });
}

function setHeaderActive(activeId) {
  ['btn-view','btn-edit'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = id === activeId ? 'btn btn-primary' : 'btn btn-secondary';
  });
}

function addCard() {
  const deck = state.decks.find(d=>d.id===state.currentDeckId);
  if (!deck) return;
  deck.cards.push({id: uid(), q:'', a:'', wrongCount:0});
  showEditDeck();
  const items = document.querySelectorAll('.card-edit-item');
  if (items.length) items[items.length-1].scrollIntoView({behavior:'smooth'});
}

function deleteCard(cardId) {
  const deck = state.decks.find(d=>d.id===state.currentDeckId);
  if (!deck) return;
  if (deck.cards.length <= 1) { showToast('Need at least 1 card'); return; }
  deck.cards = deck.cards.filter(c=>c.id!==cardId);
  showEditDeck();
}

function saveDeckEdits() {
  const deck = state.decks.find(d=>d.id===state.currentDeckId);
  if (!deck) return;
  document.querySelectorAll('.card-edit-item').forEach(item => {
    const card = deck.cards.find(c=>c.id===item.dataset.cardId);
    if (!card) return;
    const qEl = item.querySelector('[data-type="q"]');
    const aEl = item.querySelector('[data-type="a"]');
    if (qEl) card.q = qEl.value.trim();
    if (aEl) card.a = aEl.value.trim();
  });
  deck.cards = deck.cards.filter(c=>c.q||c.a);
  saveData().then(() => { showToast('Saved'); showDeckCards(); });
}

// ── STUDY ──────────────────────────────────────────────────────────────
function startStudy(deckId, wrongOnly) {
  const deck = state.decks.find(d=>d.id===deckId);
  if (!deck) return;
  let cards = wrongOnly ? deck.cards.filter(c=>c.wrongCount>0) : [...deck.cards];
  if (!cards.length) { showToast('No cards to study'); return; }
  for (let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]; }
  state.studyCards = cards;
  state.currentCardIndex = 0;
  state.cardFlipped = false;
  state.sessionResults = {correct:0, wrong:0};
  state.currentDeckId = deckId;
  state.currentView = 'study';
  renderStudyCard();
}

function studyDeckById(id, wrongOnly) {
  selectDeck(id);
  setTimeout(() => startStudy(id, wrongOnly), 50);
}

function studyWrongDeck(folderId) {
  const folder = state.folders.find(f=>f.id===folderId);
  const folderDecks = state.decks.filter(d=>d.folderId===folderId);
  let wrongCards = [];
  folderDecks.forEach(deck => {
    deck.cards.filter(c=>c.wrongCount>0).forEach(c => wrongCards.push({...c, _deckId:deck.id}));
  });
  if (!wrongCards.length) { showToast('No incorrect cards'); return; }
  for (let i=wrongCards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[wrongCards[i],wrongCards[j]]=[wrongCards[j],wrongCards[i]]; }
  state.studyCards = wrongCards;
  state.currentCardIndex = 0;
  state.cardFlipped = false;
  state.sessionResults = {correct:0, wrong:0};
  state.currentView = 'study';
  document.getElementById('mainTitle').textContent = folder?.name ? folder.name + ' — Review' : 'Review';
  document.getElementById('breadcrumb').innerHTML = '';
  document.getElementById('headerActions').innerHTML = `<button class="btn btn-secondary" onclick="showHome()">Exit</button>`;
  renderStudyCard();
}

function renderStudyCard() {
  const total = state.studyCards.length;
  const i = state.currentCardIndex;
  if (i >= total) { showSessionComplete(); return; }
  const card = state.studyCards[i];
  const pct = (i / total) * 100;

  const hdrActions = document.getElementById('headerActions');
  if (!hdrActions.innerHTML.includes('Exit')) {
    hdrActions.innerHTML = `<button class="btn btn-secondary" onclick="exitStudy()">Exit</button>`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="study-view">
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card-counter">Card <span>${i+1}</span> of <span>${total}</span></div>
      <div class="flashcard-wrap" onclick="flipCard()">
        <div class="flashcard-inner ${state.cardFlipped?'flipped':''}" id="flashcardInner">
          <div class="flashcard-face">
            <div class="card-hint">Question &mdash; tap to reveal</div>
            <div class="card-text">${esc(card.q)}</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="card-hint">Answer</div>
            <div class="card-text card-text-answer">${esc(card.a)}</div>
          </div>
        </div>
      </div>
      ${state.cardFlipped ? `
        <div class="study-actions">
          <button class="answer-btn btn-wrong" onclick="markCard(false)">Incorrect</button>
          <button class="answer-btn btn-correct" onclick="markCard(true)">Correct</button>
        </div>` : `
        <div style="text-align:center;color:var(--text3);font-size:12px;letter-spacing:0.04em">Tap card to reveal answer</div>`}
      <div class="study-nav" style="margin-top:14px">
        <button class="btn btn-secondary" onclick="skipCard()">Skip</button>
        ${i > 0 ? `<button class="btn btn-secondary" onclick="prevCard()">Back</button>` : ''}
      </div>
    </div>`;
}

function flipCard() {
  state.cardFlipped = !state.cardFlipped;
  renderStudyCard();
}

function markCard(correct) {
  const card = state.studyCards[state.currentCardIndex];
  const realCard = findRealCard(card.id, card._deckId || state.currentDeckId);
  if (realCard) {
    if (!correct) {
      realCard.wrongCount = (realCard.wrongCount||0) + 1;
    } else {
      if (realCard.wrongCount > 0) realCard.wrongCount--;
    }
  }
  correct ? state.sessionResults.correct++ : state.sessionResults.wrong++;
  state.currentCardIndex++;
  state.cardFlipped = false;
  saveData();
  renderStudyCard();
}

function skipCard() {
  state.currentCardIndex++;
  state.cardFlipped = false;
  renderStudyCard();
}

function prevCard() {
  if (state.currentCardIndex > 0) {
    state.currentCardIndex--;
    state.cardFlipped = false;
    renderStudyCard();
  }
}

function exitStudy() {
  if (state.currentDeckId) selectDeck(state.currentDeckId);
  else showHome();
}

function findRealCard(cardId, deckId) {
  if (deckId) {
    const deck = state.decks.find(d=>d.id===deckId);
    if (deck) { const c = deck.cards.find(c=>c.id===cardId); if (c) return c; }
  }
  for (const deck of state.decks) {
    const c = deck.cards.find(c=>c.id===cardId);
    if (c) return c;
  }
  return null;
}

function showSessionComplete() {
  state.currentView = 'session_complete';
  const {correct, wrong} = state.sessionResults;
  const total = correct + wrong;
  const pct = total ? Math.round(correct/total*100) : 0;

  document.getElementById('mainContent').innerHTML = `
    <div class="session-complete">
      <div class="session-title">${pct >= 80 ? 'Well done' : pct >= 50 ? 'Good effort' : 'Keep going'}</div>
      <div class="session-sub">${pct}% correct this session</div>
      <div class="result-grid">
        <div class="result-card">
          <div class="result-num" style="color:var(--correct)">${correct}</div>
          <div class="result-label">Correct</div>
        </div>
        <div class="result-card">
          <div class="result-num" style="color:var(--wrong)">${wrong}</div>
          <div class="result-label">Incorrect</div>
        </div>
      </div>
      <div class="session-actions">
        <button class="btn btn-primary" onclick="startStudy('${state.currentDeckId}',false)">Study Again</button>
        ${wrong > 0 ? `<button class="btn btn-secondary" onclick="startStudy('${state.currentDeckId}',true)">Review Incorrect (${wrong})</button>` : ''}
        <button class="btn btn-secondary" onclick="showHome()">Home</button>
      </div>
    </div>`;
}

// ── CONTEXT MENUS ──────────────────────────────────────────────────────
function openFolderMenu(e, folderId) {
  e.stopPropagation();
  showCtxMenu(e, [
    {label:'Rename', action:()=>renameFolder(folderId)},
    {label:'Add Deck', action:()=>openNewDeckModal(folderId)},
    {divider:true},
    {label:'Move Up', action:()=>moveFolderUp(folderId)},
    {label:'Move Down', action:()=>moveFolderDown(folderId)},
    {divider:true},
    {label:'Delete Folder', danger:true, action:()=>confirmDeleteFolder(folderId)},
  ]);
}

function openDeckMenu(e, deckId) {
  e.stopPropagation();
  showCtxMenu(e, [
    {label:'Study', action:()=>{ selectDeck(deckId); startStudy(deckId,false); }},
    {label:'Rename', action:()=>renameDeck(deckId)},
    {label:'Move to Folder', action:()=>moveDeckToFolder(deckId)},
    {divider:true},
    {label:'Move Up', action:()=>moveDeckUp(deckId)},
    {label:'Move Down', action:()=>moveDeckDown(deckId)},
    {divider:true},
    {label:'Delete Deck', danger:true, action:()=>confirmDeleteDeck(deckId)},
  ]);
}

let ctxClose = null;
function showCtxMenu(e, items) {
  const menu = document.getElementById('ctxMenu');
  const ctxItems = document.getElementById('ctxItems');
  ctxItems.innerHTML = items.map((item,i) => {
    if (item.divider) return `<div class="ctx-divider"></div>`;
    return `<div class="ctx-item ${item.danger?'danger':''}" data-idx="${i}">${item.label}</div>`;
  }).join('');
  menu.querySelectorAll('.ctx-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    if (!isNaN(idx) && items[idx]?.action) el.addEventListener('click', ()=>{ hideCtxMenu(); items[idx].action(); });
  });
  menu.style.left = Math.min(e.clientX, window.innerWidth-165)+'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight-items.length*34-16)+'px';
  menu.classList.add('open');
  if (ctxClose) document.removeEventListener('click', ctxClose);
  ctxClose = () => hideCtxMenu();
  setTimeout(() => document.addEventListener('click', ctxClose), 10);
}
function hideCtxMenu() { document.getElementById('ctxMenu').classList.remove('open'); }

// ── MODALS ─────────────────────────────────────────────────────────────
function openModal(title, sub, bodyHtml, actions) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub || '';
  document.getElementById('modalBody').innerHTML = bodyHtml || '';
  document.getElementById('modalActions').innerHTML = actions || '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => { const inp = document.querySelector('#modalBody .modal-input'); if (inp) inp.focus(); }, 100);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalIfOuter(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

function openNewFolderModal() {
  openModal('New Folder', '',
    `<input class="modal-input" id="mInput" placeholder="Folder name" maxlength="40" onkeydown="if(event.key==='Enter')submitNewFolder()">`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitNewFolder()">Create</button>`);
}
function submitNewFolder() {
  const val = document.getElementById('mInput')?.value.trim();
  if (!val) return;
  state.folders.push({id: uid(), name: val, order: state.folders.length, _open: true});
  saveData(); closeModal(); renderSidebar();
}

function openNewDeckModal(folderId) {
  const opts = state.folders.map(f=>`<option value="${f.id}" ${f.id===folderId?'selected':''}>${esc(f.name)}</option>`).join('');
  openModal('New Deck', '',
    `<input class="modal-input" id="mInput" placeholder="Deck name" maxlength="50" onkeydown="if(event.key==='Enter')submitNewDeck()">
     <select class="modal-input" id="mFolder" style="cursor:pointer">
       ${opts || '<option value="">Create a folder first</option>'}
     </select>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitNewDeck()">Create</button>`);
}
function submitNewDeck() {
  const name = document.getElementById('mInput')?.value.trim();
  const fId  = document.getElementById('mFolder')?.value;
  if (!name || !fId) { showToast('Fill in all fields'); return; }
  const deck = {id:uid(), name, folderId:fId, order:state.decks.filter(d=>d.folderId===fId).length,
    cards:[{id:uid(),q:'Question',a:'Answer',wrongCount:0}]};
  state.decks.push(deck);
  saveData(); closeModal(); renderSidebar(); selectDeck(deck.id); showEditDeck();
}

function renameFolder(id) {
  const folder = state.folders.find(f=>f.id===id);
  openModal('Rename Folder', '',
    `<input class="modal-input" id="mInput" value="${esc(folder.name)}" maxlength="40" onkeydown="if(event.key==='Enter')submitRenameFolder('${id}')">`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitRenameFolder('${id}')">Rename</button>`);
}
function submitRenameFolder(id) {
  const val = document.getElementById('mInput')?.value.trim();
  if (!val) return;
  state.folders.find(f=>f.id===id).name = val;
  saveData(); closeModal(); renderSidebar(); if (state.currentView==='home') showHome();
}

function renameDeck(id) {
  const deck = state.decks.find(d=>d.id===id);
  openModal('Rename Deck', '',
    `<input class="modal-input" id="mInput" value="${esc(deck.name)}" maxlength="50" onkeydown="if(event.key==='Enter')submitRenameDeck('${id}')">`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitRenameDeck('${id}')">Rename</button>`);
}
function submitRenameDeck(id) {
  const val = document.getElementById('mInput')?.value.trim();
  if (!val) return;
  state.decks.find(d=>d.id===id).name = val;
  saveData(); closeModal(); renderSidebar();
  if (state.currentDeckId===id) document.getElementById('mainTitle').textContent = val;
}

function moveDeckToFolder(deckId) {
  const deck = state.decks.find(d=>d.id===deckId);
  const opts = state.folders.map(f=>`<option value="${f.id}" ${f.id===deck.folderId?'selected':''}>${esc(f.name)}</option>`).join('');
  openModal('Move Deck', `"${esc(deck.name)}"`,
    `<select class="modal-input" id="mFolder" style="cursor:pointer">${opts}</select>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitMoveDeck('${deckId}')">Move</button>`);
}
function submitMoveDeck(deckId) {
  const fId = document.getElementById('mFolder')?.value;
  const deck = state.decks.find(d=>d.id===deckId);
  deck.folderId = fId;
  deck.order = state.decks.filter(d=>d.folderId===fId&&d.id!==deckId).length;
  saveData(); closeModal(); renderSidebar(); showToast('Moved');
}

function confirmDeleteFolder(id) {
  const folder = state.folders.find(f=>f.id===id);
  const n = state.decks.filter(d=>d.folderId===id).length;
  openModal('Delete Folder', `"${folder.name}" and its ${n} deck(s) will be removed.`, '',
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="deleteFolder('${id}')">Delete</button>`);
}
function deleteFolder(id) {
  state.folders = state.folders.filter(f=>f.id!==id);
  state.decks   = state.decks.filter(d=>d.folderId!==id);
  saveData(); closeModal(); renderSidebar(); showHome();
}

function confirmDeleteDeck(id) {
  const deck = state.decks.find(d=>d.id===id);
  openModal('Delete Deck', `"${deck.name}" will be permanently removed.`, '',
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="deleteDeck('${id}')">Delete</button>`);
}
function deleteDeck(id) {
  state.decks = state.decks.filter(d=>d.id!==id);
  saveData(); closeModal(); renderSidebar(); showHome();
}

// ── REORDER ────────────────────────────────────────────────────────────
function moveFolderUp(id) {
  const sorted = [...state.folders].sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(f=>f.id===id);
  if (idx<=0) return;
  [sorted[idx-1].order, sorted[idx].order] = [sorted[idx].order, sorted[idx-1].order];
  saveData(); renderSidebar();
}
function moveFolderDown(id) {
  const sorted = [...state.folders].sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(f=>f.id===id);
  if (idx>=sorted.length-1) return;
  [sorted[idx+1].order, sorted[idx].order] = [sorted[idx].order, sorted[idx+1].order];
  saveData(); renderSidebar();
}
function moveDeckUp(id) {
  const deck = state.decks.find(d=>d.id===id);
  const peers = state.decks.filter(d=>d.folderId===deck.folderId).sort((a,b)=>a.order-b.order);
  const idx = peers.findIndex(d=>d.id===id);
  if (idx<=0) return;
  [peers[idx-1].order, peers[idx].order] = [peers[idx].order, peers[idx-1].order];
  saveData(); renderSidebar();
}
function moveDeckDown(id) {
  const deck = state.decks.find(d=>d.id===id);
  const peers = state.decks.filter(d=>d.folderId===deck.folderId).sort((a,b)=>a.order-b.order);
  const idx = peers.findIndex(d=>d.id===id);
  if (idx>=peers.length-1) return;
  [peers[idx+1].order, peers[idx].order] = [peers[idx].order, peers[idx+1].order];
  saveData(); renderSidebar();
}

// ── TOAST ──────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── MOBILE ─────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
}

// ── KEYBOARD ───────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (state.currentView !== 'study') return;
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') skipCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (state.cardFlipped) {
    if (e.key === '1' || e.key === 'ArrowDown') markCard(false);
    if (e.key === '2' || e.key === 'Enter')     markCard(true);
  }
});

// ── HELPERS ────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── EXPOSE GLOBALS ─────────────────────────────────────────────────────
Object.assign(window, {
  showHome, selectDeck, showDeckCards, showEditDeck,
  addCard, deleteCard, saveDeckEdits,
  startStudy, studyDeckById, studyWrongDeck,
  flipCard, markCard, skipCard, prevCard, exitStudy,
  openFolderMenu, openDeckMenu,
  openNewFolderModal, openNewDeckModal, submitNewFolder, submitNewDeck,
  renameFolder, submitRenameFolder, renameDeck, submitRenameDeck,
  moveDeckToFolder, submitMoveDeck,
  confirmDeleteFolder, deleteFolder, confirmDeleteDeck, deleteDeck,
  closeModal, closeModalIfOuter,
  toggleFolder, toggleSidebar, closeSidebar,
  moveFolderUp, moveFolderDown, moveDeckUp, moveDeckDown,
});
</script>
</body>
</html>
