<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Flashcards</title>
<style>
  :root{
    --bg:#000; --panel:#1c1c1e; --panel-2:#2c2c2e; --line:#2c2c2e;
    --text:#fff; --muted:#8e8e93; --blue:#0a84ff; --red:#ff453a; --green:#30d158;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%}
  .app{max-width:1100px;margin:0 auto;padding:14px clamp(14px,3vw,28px) 32px;min-height:100vh;min-height:100dvh}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
  .topbar .left,.topbar .right{display:flex;align-items:center;gap:18px}
  .icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);border-radius:8px}
  .icon-btn:hover{background:#ffffff10}
  .icon-btn.disabled{color:#3a3a3c;cursor:default}
  .back{color:var(--blue);font-size:17px;display:inline-flex;align-items:center;gap:4px}
  .title{font-size:clamp(28px,4vw,40px);font-weight:800;margin:14px 0 16px;letter-spacing:-.02em}
  .h-center{font-size:17px;font-weight:600;text-align:center;flex:1}
  .list{background:transparent;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:12px;padding:16px 16px;border-top:1px solid var(--line);background:#1c1c1e;min-height:56px}
  .row:first-child{border-top:0}
  .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{color:var(--muted);font-size:15px}
  .row .chev{color:#48484a}
  .row.button-row{justify-content:center;color:var(--text);font-weight:500}
  .row.danger{color:var(--red);justify-content:center;font-weight:500}
  .deck-ic{width:24px;height:24px;color:#aeaeb2;flex:none}
  .section-gap{height:18px}
  .help{color:var(--muted);font-size:13px;padding:10px 4px 0;line-height:1.45}
  .fab-row{margin-top:18px}
  /* Modal */
  .scrim{position:fixed;inset:0;background:#000000aa;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:50;overflow:auto}
  .scrim.open{display:flex}
  .sheet{width:min(720px,100%);background:#1c1c1e;border-radius:16px;border:1px solid #2c2c2e;padding:18px;margin:auto}
  .sheet header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px}
  .sheet header .cancel{color:var(--blue);justify-self:start;font-size:17px}
  .sheet header .save{color:var(--blue);justify-self:end;font-size:17px;font-weight:600}
  .sheet header .save[disabled]{opacity:.4;cursor:default}
  .seg{display:inline-flex;background:#2c2c2e;border-radius:9px;padding:3px;justify-self:center}
  .seg button{padding:6px 12px;border-radius:7px;font-size:14px;color:#fff;opacity:.55}
  .seg button.active{background:#48484a;opacity:1}
  .seg button.locked{opacity:.35;cursor:not-allowed}
  .label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:14px 4px 8px}
  .field{background:#2c2c2e;border-radius:10px;padding:14px 14px;font-size:17px}
  .field.textarea{min-height:64px}
  .field + .field{margin-top:8px}
  .field-btn{display:flex;align-items:center;justify-content:center;background:#2c2c2e;border-radius:10px;padding:14px;font-size:17px}
  .primary{width:100%;background:#2c2c2e;border-radius:10px;padding:14px;font-size:17px;margin-top:18px}
  .primary.blue{background:var(--blue);color:#fff;font-weight:600}
  /* Study */
  .study-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
  .card-face{background:#1c1c1e;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:28px;font-size:clamp(22px,3.4vw,34px);font-weight:500;line-height:1.3;
    height:calc(100vh - 240px);height:calc(100dvh - 240px);min-height:280px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .actions .one{grid-column:1/-1}
  .btn-pill{padding:18px;border-radius:14px;font-size:18px;font-weight:600;text-align:center}
  .btn-red{background:#7a2a26;color:#fff}
  .btn-green{background:#1f5c2e;color:#fff}
  .btn-blue{background:var(--blue);color:#fff}
  /* Edit cards list */
  .card-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px 0;border-top:1px solid #1c1c1e}
  .card-item:first-child{border-top:0}
  .card-q{font-size:17px}
  .card-sep{color:#48484a;margin:6px 0}
  .card-a{color:#d1d1d6;font-size:16px}
  .card-num{color:#8e8e93;font-size:15px;padding-top:2px}
  /* Auth */
  .auth-wrap{max-width:380px;margin:18vh auto 0;padding:0 16px}
  .auth-wrap h1{font-size:28px;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
  .auth-wrap .field{margin-bottom:10px}
  .auth-wrap .err{color:var(--red);font-size:14px;min-height:18px;margin:6px 2px}
  .auth-wrap .switch{color:var(--blue);text-align:center;display:block;margin-top:14px;font-size:15px}
  .empty{color:var(--muted);text-align:center;padding:60px 16px;font-size:15px}
  .done h2{font-size:36px;font-weight:800;text-align:center;margin:40px 0 28px}
  .done .line{text-align:center;font-size:22px;margin:8px 0;font-weight:600}
  .done .done-btn{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom))}
  .study-actions-fixed{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(to top,#000 70%,transparent)}
  @media (min-width:900px){
    .card-face{height:60vh}
  }
  .hidden{display:none!important}
  .spacer{flex:1}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDk2Np8D7FkcTLLtR3sY0JRvRXrsi58ZDY",
  authDomain: "tune-6a7b5.firebaseapp.com",
  projectId: "tune-6a7b5",
  storageBucket: "tune-6a7b5.firebasestorage.app",
  messagingSenderId: "14662217624",
  appId: "1:14662217624:web:54746870d24713bc9705ed",
  measurementId: "G-9H0VMN285L"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ----- State -----
const state = {
  user: null,
  data: { decks: [] },     // {id,name,cards:[{id,front,back,result:null|'correct'|'incorrect'}]}
  view: { name: "decks" }, // decks | deck | study | editCards | done
  current: { deckId: null, idx: 0, revealed: false, filter: "all", results: { correct:0, incorrect:0, skipped:0 } },
  modal: null, // {type, ...}
  unsub: null,
  saveTimer: null,
};

const uid = () => Math.random().toString(36).slice(2,10);
const $ = (sel,root=document)=>root.querySelector(sel);

function save() {
  if (!state.user) return;
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(async ()=>{
    try { await setDoc(doc(db,"users",state.user.uid),{ data: state.data, updatedAt: Date.now() }); }
    catch(e){ console.error(e); }
  }, 250);
}

function subscribeUser() {
  if (state.unsub) state.unsub();
  state.unsub = onSnapshot(doc(db,"users",state.user.uid), (snap)=>{
    if (snap.exists()) {
      const d = snap.data();
      if (d && d.data && Array.isArray(d.data.decks)) {
        state.data = d.data;
      }
    } else {
      // seed
      state.data = { decks: [] };
      save();
    }
    render();
  }, (e)=>console.error(e));
}

// ----- Auth view -----
function renderAuth(mode="signin", err=""){
  document.getElementById("root").innerHTML = `
    <div class="auth-wrap">
      <h1>${mode==="signin"?"Sign in":"Create account"}</h1>
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="email" />
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="${mode==="signin"?"current-password":"new-password"}" />
      <div class="err">${err||""}</div>
      <button class="primary blue" id="go">${mode==="signin"?"Sign in":"Sign up"}</button>
      <a class="switch" id="switch">${mode==="signin"?"Create an account":"I already have an account"}</a>
    </div>`;
  $("#switch").onclick = ()=>renderAuth(mode==="signin"?"signup":"signin");
  $("#go").onclick = async ()=>{
    const email = $("#email").value.trim(), pass = $("#password").value;
    if (!email || !pass) return renderAuth(mode,"Enter email and password.");
    try {
      if (mode==="signin") await signInWithEmailAndPassword(auth,email,pass);
      else await createUserWithEmailAndPassword(auth,email,pass);
    } catch(e){ renderAuth(mode, e.message.replace("Firebase: ","")); }
  };
}

// ----- Icons -----
const ICON = {
  gearUser:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>`,
  play:`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  plus:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  back:`<svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 3 3 11 11 19"/></svg>`,
  chev:`<svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 2 8 8 2 14"/></svg>`,
  deck:`<svg class="deck-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"/><rect x="3" y="7" width="14" height="14" rx="2"/></svg>`,
  prev:`<svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 3 3 11 11 19"/></svg>`,
  next:`<svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 3 11 11 3 19"/></svg>`,
  toggles:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.5" fill="currentColor"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.5" fill="currentColor"/></svg>`,
};

// ----- Views -----
function render(){
  const root = document.getElementById("root");
  if (!state.user) return renderAuth();
  const v = state.view.name;
  if (v==="decks") root.innerHTML = viewDecks();
  else if (v==="deck") root.innerHTML = viewDeck();
  else if (v==="editCards") root.innerHTML = viewEditCards();
  else if (v==="study") root.innerHTML = viewStudy();
  else if (v==="done") root.innerHTML = viewDone();
  bind();
  renderModal();
}

function viewDecks(){
  const decks = state.data.decks;
  return `
    <div class="app">
      <div class="topbar">
        <div class="left">
          <button class="icon-btn" id="signout" title="Account">${ICON.gearUser}</button>
        </div>
        <div class="right">
          <button class="icon-btn ${decks.length?'':'disabled'}" id="playAll" ${decks.length?'':'disabled'}>${ICON.play}</button>
          <button class="icon-btn" id="add">${ICON.plus}</button>
        </div>
      </div>
      <h1 class="title">Decks</h1>
      ${decks.length ? `
      <div class="list">
        ${decks.map(d=>`
          <div class="row" data-deck="${d.id}">
            ${ICON.deck}
            <div class="grow">${escapeHtml(d.name)}</div>
            <span class="chev">${ICON.chev}</span>
          </div>`).join("")}
      </div>` : `<div class="empty">No decks yet. Tap + to add your first deck.</div>`}
      <div class="section-gap"></div>
      <div class="list fab-row">
        <div class="row button-row" id="addRow">Add</div>
      </div>
    </div>`;
}

function getDeck(id){ return state.data.decks.find(d=>d.id===id); }

function viewDeck(){
  const d = getDeck(state.current.deckId); if(!d) { state.view={name:"decks"}; return viewDecks(); }
  const total = d.cards.length;
  const incorrect = d.cards.filter(c=>c.result==="incorrect").length;
  return `
    <div class="app">
      <div class="topbar">
        <div class="left"><button class="back" id="back">${ICON.back}<span>Decks</span></button></div>
        <div class="right">
          <button class="icon-btn ${total?'':'disabled'}" id="play" ${total?'':'disabled'}>${ICON.play}</button>
          <button class="icon-btn" id="add">${ICON.plus}</button>
        </div>
      </div>
      <h1 class="title">${escapeHtml(d.name)}</h1>
      <div class="list">
        <div class="row button-row" id="editDeck">Edit deck</div>
        <div class="row" id="editCards"><div class="grow">Edit cards</div><span class="chev">${ICON.chev}</span></div>
      </div>
      <div class="section-gap"></div>
      <div class="list">
        <div class="row" id="studyAll"><div class="grow">Study all cards</div><div class="meta">${total} cards</div><span class="chev">${ICON.chev}</span></div>
        <div class="row" id="studyFiltered"><div class="grow">Study filtered cards</div><div class="meta">${incorrect} cards</div><span class="chev">${ICON.chev}</span></div>
        <div class="row"><div class="grow">Filter</div><div class="meta">Last answered incorrectly</div></div>
      </div>
    </div>`;
}

function viewEditCards(){
  const d = getDeck(state.current.deckId); if(!d){ state.view={name:"decks"};return viewDecks();}
  const q = (state.current.search||"").toLowerCase();
  const items = d.cards.map((c,i)=>({c,i})).filter(({c})=>!q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q));
  return `
    <div class="app">
      <div class="topbar">
        <div class="left"><button class="back" id="back">${ICON.back}<span>${escapeHtml(d.name)}</span></button></div>
        <div class="right" style="flex:1;justify-content:flex-end">
          <button class="icon-btn" id="add">${ICON.plus}</button>
        </div>
      </div>
      <h1 class="title">Edit cards</h1>
      ${items.length? `<div>${items.map(({c,i})=>`
        <div class="card-item" data-card="${c.id}">
          <div>
            <div class="card-q">${escapeHtml(c.front)}</div>
            <div class="card-sep">~</div>
            <div class="card-a">${escapeHtml(c.back)}</div>
          </div>
          <div class="card-num">${i+1}</div>
        </div>`).join("")}</div>` : `<div class="empty">No cards yet. Tap + to add one.</div>`}
    </div>`;
}

function viewStudy(){
  const d = getDeck(state.current.deckId); if(!d){ state.view={name:"decks"};return viewDecks();}
  const list = currentStudyList();
  if (!list.length) { state.view={name:"done"}; return viewDone(); }
  const idx = Math.min(state.current.idx, list.length-1);
  const c = list[idx];
  const revealed = state.current.revealed;
  return `
    <div class="app">
      <div class="topbar">
        <div class="left"><button class="back" id="back">${ICON.back}<span>${escapeHtml(d.name)}</span></button></div>
        <div class="h-center">${idx+1}/${list.length}</div>
        <div class="right">
          <button class="icon-btn" id="prev" ${idx===0?'disabled':''} style="${idx===0?'opacity:.35':''}">${ICON.prev}</button>
          <button class="icon-btn" id="next" ${idx>=list.length-1?'disabled':''} style="${idx>=list.length-1?'opacity:.35':''}">${ICON.next}</button>
          <button class="back" id="editCardBtn">Edit</button>
        </div>
      </div>
      <div class="card-face">${escapeHtml(revealed? c.back : c.front)}</div>
      <div class="actions">
        ${ revealed
          ? `<button class="btn-pill btn-red" id="incorrect">Incorrect</button>
             <button class="btn-pill btn-green" id="correct">Correct</button>`
          : `<button class="btn-pill btn-blue one" id="reveal">Reveal</button>` }
      </div>
    </div>`;
}

function viewDone(){
  const r = state.current.results;
  return `
    <div class="app done">
      <div class="topbar">
        <div class="left"><button class="back" id="back">${ICON.back}<span>${escapeHtml(getDeck(state.current.deckId)?.name||"")}</span></button></div>
        <div class="right"><button class="back" disabled style="opacity:.4">Edit</button></div>
      </div>
      <h2>Done</h2>
      <div class="line">Correct: ${r.correct}</div>
      <div class="line">Incorrect: ${r.incorrect}</div>
      <div class="line">Skipped: ${r.skipped}</div>
      <div style="height:80px"></div>
      <button class="btn-pill btn-blue done-btn" id="doneBtn">Done</button>
    </div>`;
}

function currentStudyList(){
  const d = getDeck(state.current.deckId); if(!d) return [];
  if (state.current.filter==="incorrect") return d.cards.filter(c=>c.result==="incorrect");
  return d.cards;
}

// ----- Modals -----
function renderModal(){
  let scrim = document.getElementById("scrim");
  if (!scrim){ scrim = document.createElement("div"); scrim.id="scrim"; scrim.className="scrim"; document.body.appendChild(scrim); }
  if (!state.modal){ scrim.className="scrim"; scrim.innerHTML=""; return; }
  scrim.className="scrim open";
  const m = state.modal;
  if (m.type==="addEntity") scrim.innerHTML = modalAddEntity(m);
  else if (m.type==="editDeck") scrim.innerHTML = modalEditDeck(m);
  else if (m.type==="editCard") scrim.innerHTML = modalEditCard(m);
  bindModal();
}

function modalAddEntity(m){
  // segmented: Add folder (locked) | Add deck | Add card
  const tab = m.tab || "deck";
  return `<div class="sheet">
    <header>
      <button class="cancel" id="cancel">Cancel</button>
      <div class="seg">
        <button class="locked" disabled>Add folder</button>
        <button class="${tab==='deck'?'active':''}" data-tab="deck">Add deck</button>
        <button class="${tab==='card'?'active':''}" data-tab="card">Add card</button>
      </div>
      <button class="save" id="save">Save</button>
    </header>
    ${tab==="deck"? `
      <div class="label">NAME</div>
      <input class="field" id="deckName" placeholder="Enter deck name" value="${escapeAttr(m.name||"")}" />
    `: `
      <div class="label">DECK</div>
      <div class="field-btn" id="pickDeck">${escapeHtml((getDeck(m.deckId)||state.data.decks[0])?.name||"Choose deck")}<span style="margin-left:auto;color:#48484a">${ICON.chev}</span></div>
      <div class="label">TEXT</div>
      <input class="field" id="front" placeholder="Enter front text" value="${escapeAttr(m.front||"")}" />
      <input class="field" id="back" placeholder="Enter back text" value="${escapeAttr(m.back||"")}" />
    `}
    <button class="primary" id="save2">Save</button>
  </div>`;
}

function modalEditDeck(m){
  const d = getDeck(m.deckId);
  return `<div class="sheet">
    <header>
      <button class="cancel" id="cancel">Cancel</button>
      <div style="font-weight:600">Edit deck</div>
      <button class="save" id="save">Save</button>
    </header>
    <div class="label">NAME</div>
    <input class="field" id="deckName" value="${escapeAttr(d?.name||"")}" />
    <button class="primary" id="reset">Reset results</button>
    <button class="primary" style="color:var(--red)" id="remove">Remove this deck</button>
    <button class="primary" id="save2">Save</button>
  </div>`;
}

function modalEditCard(m){
  const c = getDeck(m.deckId)?.cards.find(x=>x.id===m.cardId);
  if (!c){ state.modal=null; return ""; }
  return `<div class="sheet">
    <header>
      <button class="cancel" id="cancel">Cancel</button>
      <div style="font-weight:600">Edit card</div>
      <button class="save" id="save">Save</button>
    </header>
    <div class="label">DECK</div>
    <div class="field-btn">${escapeHtml(getDeck(m.deckId).name)}</div>
    <div class="label">TEXT</div>
    <input class="field" id="front" value="${escapeAttr(c.front)}" />
    <input class="field" id="back" value="${escapeAttr(c.back)}" />
    <button class="primary" style="color:var(--red)" id="remove">Delete card</button>
    <button class="primary" id="save2">Save</button>
  </div>`;
}

// ----- Bindings -----
function bind(){
  const v = state.view.name;
  const on = (sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  if (v==="decks"){
    $("#signout").onclick = ()=>signOut(auth);
    $("#add").onclick = ()=>{ state.modal={type:"addEntity",tab:"deck"}; renderModal(); };
    $("#addRow").onclick = ()=>{ state.modal={type:"addEntity",tab:"deck"}; renderModal(); };
    const play = $("#playAll"); if (play && !play.disabled) play.onclick = ()=>{
      const first = state.data.decks[0]; if(!first) return;
      startStudy(first.id,"all");
    };
    on("[data-deck]","click",e=>{
      state.current.deckId = e.currentTarget.dataset.deck;
      state.view = {name:"deck"};
      render();
    });
  }
  if (v==="deck"){
    $("#back").onclick = ()=>{ state.view={name:"decks"}; render(); };
    $("#editDeck").onclick = ()=>{ state.modal={type:"editDeck",deckId:state.current.deckId}; renderModal(); };
    $("#editCards").onclick = ()=>{ state.view={name:"editCards"}; state.current.search=""; render(); };
    $("#studyAll").onclick = ()=>startStudy(state.current.deckId,"all");
    $("#studyFiltered").onclick = ()=>startStudy(state.current.deckId,"incorrect");
    $("#add").onclick = ()=>{ state.modal={type:"addEntity",tab:"card",deckId:state.current.deckId}; renderModal(); };
    const p = $("#play"); if(p && !p.disabled) p.onclick = ()=>startStudy(state.current.deckId,"all");
  }
  if (v==="editCards"){
    $("#back").onclick = ()=>{ state.view={name:"deck"}; render(); };
    $("#add").onclick = ()=>{ state.modal={type:"addEntity",tab:"card",deckId:state.current.deckId}; renderModal(); };
    on("[data-card]","click",e=>{
      state.modal = { type:"editCard", deckId: state.current.deckId, cardId: e.currentTarget.dataset.card };
      renderModal();
    });
  }
  if (v==="study"){
    $("#back").onclick = ()=>{ state.view={name:"deck"}; render(); };
    const list = currentStudyList(); const c = list[state.current.idx];
    if ($("#reveal")) $("#reveal").onclick = ()=>{ state.current.revealed=true; render(); };
    if ($("#correct")) $("#correct").onclick = ()=>grade("correct");
    if ($("#incorrect")) $("#incorrect").onclick = ()=>grade("incorrect");
    if ($("#prev")) $("#prev").onclick = ()=>{ if(state.current.idx>0){state.current.idx--;state.current.revealed=false;render();} };
    if ($("#next")) $("#next").onclick = ()=>{ if(state.current.idx<list.length-1){state.current.idx++;state.current.revealed=false;render();} };
    if ($("#editCardBtn")) $("#editCardBtn").onclick = ()=>{
      state.modal={type:"editCard",deckId:state.current.deckId,cardId:c.id}; renderModal();
    };
  }
  if (v==="done"){
    $("#back").onclick = ()=>{ state.view={name:"deck"}; render(); };
    $("#doneBtn").onclick = ()=>{ state.view={name:"deck"}; render(); };
  }
}

function grade(result){
  const list = currentStudyList(); const c = list[state.current.idx]; if (!c) return;
  const deck = getDeck(state.current.deckId);
  const real = deck.cards.find(x=>x.id===c.id); real.result = result;
  state.current.results[result]++;
  // count skipped logic: skipped = remaining unanswered if user exits; here we just advance
  save();
  if (state.current.idx >= list.length-1){
    // recompute skipped: cards in list never graded during this session — approximate as 0 if all answered
    state.view = {name:"done"}; render();
  } else {
    state.current.idx++; state.current.revealed=false; render();
  }
}

function startStudy(deckId, filter){
  const d = getDeck(deckId); if(!d) return;
  state.current = { deckId, idx:0, revealed:false, filter, results:{correct:0,incorrect:0, skipped: (filter==="incorrect"? d.cards.filter(c=>c.result==="incorrect").length : d.cards.length)} };
  // reset skipped after grading: we'll subtract on grade
  const orig = state.current.results.skipped;
  const origGrade = grade;
  // Better: compute skipped at Done time
  state.current.results.skipped = orig;
  state.view = {name:"study"};
  render();
}

// Override grade to decrement skipped
const _grade = grade;
window.__noop = _grade;
function bindModal(){
  if (!state.modal) return;
  const m = state.modal;
  const close = ()=>{ state.modal=null; renderModal(); };
  $("#cancel").onclick = close;
  document.getElementById("scrim").onclick = (e)=>{ if(e.target.id==="scrim") close(); };
  document.querySelectorAll(".sheet").forEach(el=>el.onclick=e=>e.stopPropagation());

  if (m.type==="addEntity"){
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ m.tab=b.dataset.tab; renderModal(); });
    const doSave = ()=>{
      if (m.tab==="deck"){
        const name = $("#deckName").value.trim(); if(!name) return;
        state.data.decks.push({ id:uid(), name, cards:[] });
      } else {
        const front = $("#front").value.trim(), back = $("#back").value.trim();
        if (!front && !back) return;
        const deckId = m.deckId || state.data.decks[0]?.id;
        const d = getDeck(deckId); if(!d) return;
        d.cards.push({ id:uid(), front, back, result:null });
      }
      save(); close();
    };
    $("#save").onclick = doSave; $("#save2").onclick = doSave;
  }
  if (m.type==="editDeck"){
    const d = getDeck(m.deckId);
    const doSave = ()=>{ d.name = $("#deckName").value.trim() || d.name; save(); close(); };
    $("#save").onclick = doSave; $("#save2").onclick = doSave;
    $("#reset").onclick = ()=>{ d.cards.forEach(c=>c.result=null); save(); close(); };
    $("#remove").onclick = ()=>{
      if (!confirm("Remove this deck?")) return;
      state.data.decks = state.data.decks.filter(x=>x.id!==d.id);
      save(); state.view={name:"decks"}; close(); render();
    };
  }
  if (m.type==="editCard"){
    const d = getDeck(m.deckId); const c = d.cards.find(x=>x.id===m.cardId);
    const doSave = ()=>{ c.front = $("#front").value; c.back = $("#back").value; save(); close(); };
    $("#save").onclick = doSave; $("#save2").onclick = doSave;
    $("#remove").onclick = ()=>{
      d.cards = d.cards.filter(x=>x.id!==c.id); save(); close();
      if (state.view.name==="study"){ state.view={name:"deck"}; render(); }
    };
  }
}

// helpers
function escapeHtml(s){ return (s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// auth lifecycle
onAuthStateChanged(auth,(u)=>{
  state.user = u;
  if (u) subscribeUser();
  else { if(state.unsub){state.unsub();state.unsub=null;} state.data={decks:[]}; }
  render();
});

render();
</script>
