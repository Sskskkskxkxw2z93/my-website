<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slate | Flashcards</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1C1C1E;
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-blue: #0A84FF;
            --accent-red: #FF453A;
            --accent-green: #30D158;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column; /* Default for mobile */
            overflow: hidden;
        }

        /* --- Auth Screen --- */
        #auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            z-index: 9999;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            background: #1C1C1E;
            border: 1px solid var(--panel-border);
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-size: 17px; /* Prevents iOS auto-zoom */
            margin-bottom: 12px;
            outline: none;
        }

        /* --- Responsive Layout --- */
        #app-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column; /* Stacked for mobile */
        }

        /* Sidebar behaves like a Bottom Nav on Mobile */
        .sidebar {
            width: 100%;
            height: 70px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            flex-direction: row;
            order: 2; /* Move to bottom */
            padding: 0 20px;
            align-items: center;
            justify-content: space-around;
        }

        .deck-list {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            flex: 1;
        }

        .deck-item {
            padding: 8px 16px;
            border-radius: 20px;
            background: #2C2C2E;
            white-space: nowrap;
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            order: 1;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            body { flex-direction: row; }
            #app-screen { flex-direction: row; }
            .sidebar {
                width: 280px;
                height: 100vh;
                flex-direction: column;
                order: 0;
                border-top: none;
                border-right: 1px solid var(--panel-border);
                justify-content: flex-start;
                padding: 40px 20px;
            }
            .deck-list { flex-direction: column; overflow-x: hidden; }
            .main-content { padding: 60px; }
        }

        /* --- Cards & Editor --- */
        .editor-card {
            background: #1C1C1E;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            height: 80px;
            resize: none;
            outline: none;
            margin-top: 8px;
        }

        .symbol-palette {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .sym-btn {
            min-width: 44px; /* Apple standard touch size */
            height: 44px;
            background: #2C2C2E;
            border-radius: 8px;
            color: white;
            border: none;
            font-size: 18px;
        }

        .card-surface {
            width: 100%;
            aspect-ratio: 4/3;
            max-width: 500px;
            background: #1C1C1E;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            font-size: clamp(20px, 5vw, 28px);
            border: 1px solid var(--panel-border);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .primary-btn {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="font-size: 34px; margin-bottom: 10px;">Slate</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Your library, everywhere.</p>
            <input type="email" id="email" class="input-field" placeholder="Email" spellcheck="false">
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button class="primary-btn" id="auth-main-btn">Sign In</button>
            <div id="auth-toggle-btn" style="color: var(--accent-blue); margin-top: 20px; font-size: 15px;">Create Account</div>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div style="display:flex; justify-content: space-between; width:100%; margin-bottom: 10px;" class="desktop-only">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">DECKS</span>
                <button id="add-deck-btn" style="background:none; color:var(--accent-blue); border:none; font-size:22px;">+</button>
            </div>
            <div id="deck-list" class="deck-list"></div>
            <button id="logout-btn" style="background:none; color:var(--accent-red); border:none; font-size: 13px; padding: 10px;">Sign Out</button>
        </div>

        <div class="main-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <h2 id="view-title" style="font-size: 24px;">Library</h2>
                <div id="action-btns" class="hidden">
                    <button id="go-add-btn" style="background:#2C2C2E; color:white; border:none; padding:8px 15px; border-radius:15px; font-size:13px; font-weight:600;">Add</button>
                    <button id="go-study-btn" style="background:var(--accent-blue); color:white; border:none; padding:8px 15px; border-radius:15px; font-size:13px; font-weight:600;">Study</button>
                </div>
            </div>

            <div id="view-add" class="hidden">
                <div id="palette" class="symbol-palette"></div>
                <div class="editor-card">
                    <textarea id="front-in" placeholder="Question / Formula"></textarea>
                    <div style="height:1px; background:var(--panel-border); margin:15px 0;"></div>
                    <textarea id="back-in" placeholder="Answer"></textarea>
                </div>
                <button class="primary-btn" id="save-card-trigger">Save to Deck</button>
            </div>

            <div id="view-study" class="hidden" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
                <div class="card-surface" id="flashcard">
                    <div id="card-text">Tap to flip</div>
                </div>
                <div id="study-ctrls" class="hidden" style="display:flex; gap:15px; margin-top:30px; width:100%; max-width:500px;">
                    <button id="btn-wrong" style="flex:1; background:var(--accent-red); color:white; padding:15px; border-radius:15px; border:none; font-weight:600;">Again</button>
                    <button id="btn-right" style="flex:1; background:var(--accent-green); color:white; padding:15px; border-radius:15px; border:none; font-weight:600;">Got it</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLn5hL02geNL0eMU5xXXUKkrLKA0QZhfs",
            authDomain: "slate-app-8fc4c.firebaseapp.com",
            projectId: "slate-app-8fc4c",
            storageBucket: "slate-app-8fc4c.firebasestorage.app",
            messagingSenderId: "1038552772007",
            appId: "1:1038552772007:web:855420f4f2181952cc9a82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentDeckId = null;
        let deckCards = [];
        let studyIdx = 0;
        let isFront = true;
        let isLogin = true;

        // Auth Logic
        document.getElementById('auth-toggle-btn').onclick = () => {
            isLogin = !isLogin;
            document.getElementById('auth-main-btn').innerText = isLogin ? "Sign In" : "Create Account";
            document.getElementById('auth-toggle-btn').innerText = isLogin ? "Create Account" : "Back to Sign In";
        };

        document.getElementById('auth-main-btn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                if(isLogin) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').style.display = 'flex';
                loadDecks();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Deck Logic
        function loadDecks() {
            const q = query(collection(db, `users/${auth.currentUser.uid}/decks`), orderBy("createdAt", "desc"));
            onSnapshot(q, snap => {
                const list = document.getElementById('deck-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const el = document.createElement('div');
                    el.className = "deck-item";
                    el.innerText = d.name;
                    el.onclick = () => selectDeck(doc.id, d.name);
                    list.appendChild(el);
                });
            });
            initPalette();
        }

        function selectDeck(id, name) {
            currentDeckId = id;
            document.getElementById('view-title').innerText = name;
            document.getElementById('action-btns').classList.remove('hidden');
            showView('view-add');
            onSnapshot(collection(db, `users/${auth.currentUser.uid}/decks/${id}/cards`), snap => {
                deckCards = snap.docs.map(d => d.data());
            });
        }

        function showView(id) {
            ['view-add', 'view-study'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Palette & Editor
        function initPalette() {
            const syms = ['π','√','∞','θ','λ','Σ','Δ','∫','≈','≠','±','→'];
            const p = document.getElementById('palette');
            p.innerHTML = "";
            syms.forEach(s => {
                const b = document.createElement('button');
                b.className = "sym-btn";
                b.innerText = s;
                b.onclick = () => {
                    const target = document.getElementById('front-in'); // Simplified for mobile
                    target.value += s;
                    target.focus();
                };
                p.appendChild(b);
            });
        }

        document.getElementById('save-card-trigger').onclick = async () => {
            const f = document.getElementById('front-in').value;
            const b = document.getElementById('back-in').value;
            if(!f || !b) return;
            await addDoc(collection(db, `users/${auth.currentUser.uid}/decks/${currentDeckId}/cards`), { front: f, back: b });
            document.getElementById('front-in').value = "";
            document.getElementById('back-in').value = "";
        };

        // Study Logic
        document.getElementById('go-study-btn').onclick = () => {
            if(deckCards.length === 0) return alert("Deck is empty");
            studyIdx = 0;
            showView('view-study');
            renderCard();
        };

        document.getElementById('go-add-btn').onclick = () => showView('view-add');

        function renderCard() {
            if(studyIdx >= deckCards.length) {
                document.getElementById('card-text').innerText = "All Done!";
                document.getElementById('study-ctrls').classList.add('hidden');
                return;
            }
            isFront = true;
            document.getElementById('card-text').innerText = deckCards[studyIdx].front;
            document.getElementById('study-ctrls').classList.add('hidden');
        }

        document.getElementById('flashcard').onclick = () => {
            if(!isFront || studyIdx >= deckCards.length) return;
            isFront = false;
            document.getElementById('card-text').innerText = deckCards[studyIdx].back;
            document.getElementById('study-ctrls').classList.remove('hidden');
        };

        document.getElementById('btn-wrong').onclick = () => { studyIdx++; renderCard(); };
        document.getElementById('btn-right').onclick = () => { studyIdx++; renderCard(); };

        document.getElementById('add-deck-btn').onclick = async () => {
            const n = prompt("New Deck Name:");
            if(n) await addDoc(collection(db, `users/${auth.currentUser.uid}/decks`), { name: n, createdAt: Date.now() });
        };
    </script>
</body>
</html>
