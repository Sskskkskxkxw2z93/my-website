<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg2: #0a0a0a;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #ffffff;
    --text2: rgba(255,255,255,0.6);
    --text3: rgba(255,255,255,0.35);
    --accent: #0a84ff;
    --accent-hover: #0070d4;
    --green: #30d158;
    --red: #ff453a;
    --yellow: #ffd60a;
    --radius: 13px;
    --radius-lg: 20px;
    --font: -apple-system, 'SF Pro Display', BlinkMacSystemFont, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== AUTH ===== */
  #auth-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    z-index: 1000;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .auth-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(30,30,35,0.9) 0%, #000 70%);
    overflow: hidden;
  }

  .auth-bg::before {
    content: '';
    position: absolute;
    top: -20%; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, transparent 70%);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .auth-bg-lines {
    position: absolute; inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  .auth-card {
    position: relative; z-index: 1;
    background: rgba(28,28,30,0.92);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px;
    width: 380px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 0.5px rgba(255,255,255,0.06);
  }

  .auth-logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 28px;
  }

  .auth-logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(145deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .auth-logo-mark svg { width: 18px; height: 18px; }

  .auth-logo-text {
    font-size: 18px; font-weight: 600; letter-spacing: -0.3px;
  }

  .auth-title {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .auth-subtitle {
    font-size: 14px; color: var(--text2);
    margin-bottom: 32px; line-height: 1.5;
  }

  .auth-field { margin-bottom: 14px; }

  .auth-field label {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 7px;
  }

  .auth-field input {
    width: 100%; padding: 13px 15px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: var(--text);
    font-size: 15px; font-family: var(--font);
    outline: none; transition: border-color 0.2s, background 0.2s;
  }

  .auth-field input:focus {
    border-color: var(--accent);
    background: rgba(10,132,255,0.08);
  }

  .auth-field input::placeholder { color: var(--text3); }

  .auth-btn {
    width: 100%; padding: 14px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; font-family: var(--font);
    cursor: pointer; margin-top: 8px;
    transition: background 0.2s, transform 0.1s, opacity 0.2s;
    letter-spacing: -0.1px;
  }

  .auth-btn:hover { background: var(--accent-hover); }
  .auth-btn:active { transform: scale(0.99); opacity: 0.9; }

  .auth-switch {
    text-align: center; margin-top: 22px;
    font-size: 14px; color: var(--text2);
  }

  .auth-switch a {
    color: var(--accent); text-decoration: none; font-weight: 500;
    cursor: pointer;
  }

  .auth-error {
    background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.3);
    color: var(--red); border-radius: 8px; padding: 10px 13px;
    font-size: 13px; margin-bottom: 14px; display: none;
  }

  /* ===== APP LAYOUT ===== */
  #app { display: none; height: 100vh; overflow: hidden; }

  .app-layout {
    display: grid; grid-template-columns: 240px 1fr;
    height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    background: rgba(18,18,20,0.95);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 0;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 0 16px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .sidebar-logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
  }

  .logo-mark {
    width: 26px; height: 26px;
    background: linear-gradient(145deg, #fff 0%, rgba(255,255,255,0.75) 100%);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: #000;
  }

  .sidebar-section { margin-bottom: 4px; }

  .sidebar-section-title {
    padding: 10px 20px 4px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--text3);
  }

  .sidebar-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 16px; margin: 1px 8px;
    border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--text2);
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }

  .sidebar-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .sidebar-item.active { background: rgba(10,132,255,0.18); color: var(--accent); }

  .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .sidebar-folder-name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .sidebar-add-btn {
    background: none; border: none; color: var(--text3);
    cursor: pointer; padding: 4px; border-radius: 5px;
    transition: color 0.15s, background 0.15s;
    display: flex; align-items: center;
  }

  .sidebar-add-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

  .user-section {
    margin-top: auto; padding: 12px 16px 0;
    border-top: 1px solid var(--border);
  }

  .user-pill {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px;
    cursor: pointer; transition: background 0.15s;
  }

  .user-pill:hover { background: rgba(255,255,255,0.06); }

  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #5e5ce6);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 600; }
  .user-email { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .signout-btn {
    background: none; border: none; color: var(--text3);
    cursor: pointer; font-size: 11px; padding: 2px 6px;
    border-radius: 4px; transition: color 0.15s;
  }
  .signout-btn:hover { color: var(--red); }

  /* Main content */
  .main { overflow-y: auto; background: var(--bg); }

  .main-header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px); z-index: 10;
  }

  .main-title {
    font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
  }

  .main-subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 20px;
    font-size: 14px; font-weight: 600; font-family: var(--font);
    cursor: pointer; border: none; transition: all 0.15s;
    text-decoration: none; white-space: nowrap;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: rgba(255,255,255,0.1); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.16); }

  .btn-ghost { background: transparent; color: var(--text2); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  .btn svg { width: 14px; height: 14px; }

  /* Deck grid */
  .deck-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px; padding: 24px 32px;
  }

  .deck-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
    position: relative; overflow: hidden;
  }

  .deck-card:hover {
    background: var(--surface2);
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .deck-card-color {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }

  .deck-card-name {
    font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .deck-card-desc {
    font-size: 12px; color: var(--text3); margin-bottom: 14px;
    min-height: 16px; line-height: 1.4;
  }

  .deck-card-meta {
    display: flex; align-items: center; justify-content: space-between;
  }

  .deck-card-count {
    font-size: 12px; color: var(--text3); font-weight: 500;
  }

  .deck-card-actions {
    display: flex; gap: 6px; opacity: 0;
    transition: opacity 0.15s;
  }

  .deck-card:hover .deck-card-actions { opacity: 1; }

  .icon-btn {
    background: rgba(255,255,255,0.1); border: none; color: var(--text2);
    width: 28px; height: 28px; border-radius: 7px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.18); color: var(--text); }
  .icon-btn.danger:hover { background: rgba(255,69,58,0.2); color: var(--red); }
  .icon-btn svg { width: 13px; height: 13px; }

  .study-btn-sm {
    padding: 6px 13px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 14px;
    font-size: 12px; font-weight: 600; font-family: var(--font);
    cursor: pointer; transition: background 0.15s;
    display: flex; align-items: center; gap: 5px;
  }
  .study-btn-sm:hover { background: var(--accent-hover); }
  .study-btn-sm svg { width: 11px; height: 11px; }

  /* Card list view */
  .cards-view { padding: 24px 32px; }

  .cards-back-btn {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 15px; cursor: pointer;
    margin-bottom: 20px; font-weight: 500;
  }
  .cards-back-btn svg { width: 16px; height: 16px; }

  .card-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 0;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .card-item:hover { border-color: var(--border2); }

  .card-item-front, .card-item-back {
    padding: 16px 20px;
  }

  .card-item-back {
    border-left: 1px solid var(--border);
  }

  .card-item-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--text3); margin-bottom: 4px;
  }

  .card-item-text {
    font-size: 14px; font-weight: 500; line-height: 1.5;
  }

  .card-item-actions {
    padding: 0 12px;
    display: flex; align-items: center; gap: 6px;
    border-left: 1px solid var(--border);
  }

  .needs-review {
    font-size: 10px; font-weight: 600; color: var(--red);
    background: rgba(255,69,58,0.12); border-radius: 6px;
    padding: 2px 7px;
  }

  /* Study mode */
  .study-view {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 32px;
  }

  .study-header {
    position: fixed; top: 0; left: 240px; right: 0;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
    z-index: 10; border-bottom: 1px solid var(--border);
  }

  .study-progress {
    display: flex; align-items: center; gap: 12px;
  }

  .progress-bar {
    width: 200px; height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 2px; transition: width 0.3s ease;
  }

  .progress-text { font-size: 13px; color: var(--text2); }

  .flashcard-wrap {
    perspective: 1000px;
    width: 100%; max-width: 600px; margin: 80px 0 40px;
  }

  .flashcard {
    width: 100%; aspect-ratio: 3/2;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .flashcard.flipped { transform: rotateY(180deg); }

  .flashcard-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px;
    text-align: center;
  }

  .flashcard-back { transform: rotateY(180deg); }

  .flashcard-label {
    position: absolute; bottom: 24px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--text3);
  }

  .flashcard-hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text3);
  }

  .flashcard-text {
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 600; letter-spacing: -0.3px; line-height: 1.4;
  }

  .study-actions {
    display: flex; gap: 16px; align-items: center;
  }

  .study-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 28px; border-radius: 22px;
    font-size: 15px; font-weight: 600; font-family: var(--font);
    cursor: pointer; border: none; transition: all 0.15s;
  }

  .study-btn-incorrect {
    background: rgba(255,69,58,0.18); color: var(--red);
    border: 1px solid rgba(255,69,58,0.3);
  }
  .study-btn-incorrect:hover { background: rgba(255,69,58,0.28); }

  .study-btn-correct {
    background: rgba(48,209,88,0.18); color: var(--green);
    border: 1px solid rgba(48,209,88,0.3);
  }
  .study-btn-correct:hover { background: rgba(48,209,88,0.28); }

  .study-complete {
    text-align: center;
  }

  .study-complete-emoji { font-size: 60px; margin-bottom: 20px; }
  .study-complete-title {
    font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px;
  }
  .study-complete-sub { font-size: 16px; color: var(--text2); margin-bottom: 32px; }

  .study-stats {
    display: flex; gap: 20px; justify-content: center; margin-bottom: 36px;
  }

  .stat-pill {
    padding: 12px 20px; border-radius: 14px;
    text-align: center;
  }

  .stat-pill-correct { background: rgba(48,209,88,0.12); }
  .stat-pill-incorrect { background: rgba(255,69,58,0.12); }

  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    z-index: 500;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 28px;
    width: 100%; max-width: 520px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }

  .modal-title {
    font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
  }

  .modal-close {
    background: rgba(255,255,255,0.08); border: none; color: var(--text2);
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; font-size: 16px; line-height: 1;
  }
  .modal-close:hover { background: rgba(255,255,255,0.15); color: var(--text); }

  .field { margin-bottom: 16px; }

  .field label {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 7px;
  }

  .field input, .field textarea {
    width: 100%; padding: 12px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 14px; font-family: var(--font);
    outline: none; transition: border-color 0.2s, background 0.2s;
    resize: vertical;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--accent); background: rgba(10,132,255,0.06);
  }

  .field input::placeholder, .field textarea::placeholder { color: var(--text3); }

  .field textarea { min-height: 90px; }

  /* Symbol palette */
  .symbols-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; background: rgba(255,255,255,0.07);
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 12px; font-weight: 500; color: var(--text2);
    cursor: pointer; transition: background 0.15s; margin-bottom: 8px;
  }
  .symbols-toggle:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  .symbol-palette {
    display: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
    margin-bottom: 10px;
  }

  .symbol-palette.open { display: block; }

  .symbol-cats {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
  }

  .symbol-cat-btn {
    padding: 4px 10px; background: rgba(255,255,255,0.07);
    border: 1px solid transparent; border-radius: 6px;
    font-size: 11px; font-weight: 600; color: var(--text2);
    cursor: pointer; transition: all 0.15s;
  }

  .symbol-cat-btn.active {
    background: rgba(10,132,255,0.18); border-color: rgba(10,132,255,0.4);
    color: var(--accent);
  }

  .symbol-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 4px; max-height: 120px; overflow-y: auto;
  }

  .symbol-btn {
    aspect-ratio: 1; background: rgba(255,255,255,0.06);
    border: 1px solid transparent; border-radius: 6px;
    color: var(--text); font-size: 16px;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center;
  }

  .symbol-btn:hover {
    background: rgba(10,132,255,0.2); border-color: rgba(10,132,255,0.4);
    transform: scale(1.1);
  }

  .modal-footer {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
  }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 40px; text-align: center;
    color: var(--text3);
  }

  .empty-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }

  .empty-icon svg { width: 28px; height: 28px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; line-height: 1.5; margin-bottom: 20px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: rgba(44,44,46,0.96); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 20px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999; white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Chip colors */
  .color-blue { background: #0a84ff; }
  .color-green { background: #30d158; }
  .color-purple { background: #bf5af2; }
  .color-orange { background: #ff9f0a; }
  .color-pink { background: #ff375f; }
  .color-teal { background: #5ac8fa; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .animate-in { animation: slideUp 0.3s ease forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* Rename input */
  .inline-rename {
    background: none; border: none; border-bottom: 1px solid var(--accent);
    color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500;
    outline: none; width: 140px;
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-bg">
    <div class="auth-bg-lines"></div>
  </div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#000"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="#000" opacity="0.6"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="#000" opacity="0.6"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#000" opacity="0.3"/>
        </svg>
      </div>
      <span class="auth-logo-text">Slate</span>
    </div>
    <h1 class="auth-title" id="auth-title">Welcome back</h1>
    <p class="auth-subtitle" id="auth-sub">Sign in to access your flashcards on any device.</p>
    <div class="auth-error" id="auth-error"></div>
    <div id="auth-name-field" class="auth-field" style="display:none">
      <label>Name</label>
      <input type="text" id="auth-name" placeholder="Your name">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••">
    </div>
    <button class="auth-btn" id="auth-submit" onclick="handleAuth()">Sign in</button>
    <p class="auth-switch" id="auth-switch">
      New here? <a onclick="toggleAuth()">Create an account</a>
    </p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-mark">S</div>
          Slate
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-item active" id="nav-all" onclick="navigateTo('all')">
          <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.6"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.6"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.3"/></svg>
          All Decks
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title" style="display:flex;align-items:center;justify-content:space-between;padding-right:20px">
          Folders
          <button class="sidebar-add-btn" onclick="openNewFolderModal()" title="New folder">
            <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="folder-list"></div>
      </div>

      <div class="user-section">
        <div class="user-pill">
          <div class="user-avatar" id="user-avatar-sidebar"></div>
          <div class="user-info">
            <div class="user-name" id="user-name-sidebar"></div>
            <div class="user-email" id="user-email-sidebar"></div>
          </div>
        </div>
        <button class="signout-btn" onclick="signOut()" style="width:100%;text-align:left;margin-top:4px;padding:6px 10px;">Sign out</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main-content">
    </main>
  </div>
</div>

<!-- NEW DECK MODAL -->
<div class="modal-overlay" id="deck-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="deck-modal-title">New Deck</h2>
      <button class="modal-close" onclick="closeModal('deck-modal')">✕</button>
    </div>
    <div class="field">
      <label>Deck Name</label>
      <input type="text" id="deck-name-input" placeholder="e.g. Organic Chemistry">
    </div>
    <div class="field">
      <label>Description <span style="color:var(--text3);text-transform:none;font-weight:400">(optional)</span></label>
      <input type="text" id="deck-desc-input" placeholder="What's this deck about?">
    </div>
    <div class="field">
      <label>Color</label>
      <div style="display:flex;gap:8px;margin-top:2px" id="color-picker">
        <div class="color-swatch" data-color="blue" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#0a84ff;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
        <div class="color-swatch" data-color="green" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#30d158;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
        <div class="color-swatch" data-color="purple" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#bf5af2;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
        <div class="color-swatch" data-color="orange" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#ff9f0a;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
        <div class="color-swatch" data-color="pink" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#ff375f;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
        <div class="color-swatch" data-color="teal" onclick="pickColor(this)" style="width:24px;height:24px;border-radius:50%;background:#5ac8fa;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline 0.15s"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('deck-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveDeck()">Create Deck</button>
    </div>
  </div>
</div>

<!-- ADD CARD MODAL -->
<div class="modal-overlay" id="card-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="card-modal-title">Add Card</h2>
      <button class="modal-close" onclick="closeModal('card-modal')">✕</button>
    </div>
    <div class="field">
      <label>Front</label>
      <div class="symbols-toggle" onclick="toggleSymbols('front')">
        <svg viewBox="0 0 14 14" fill="none" width="12" height="12"><path d="M2 4h10M2 7h6M2 10h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Symbols
      </div>
      <div class="symbol-palette" id="symbol-front">
        <div class="symbol-cats" id="symbol-front-cats"></div>
        <div class="symbol-grid" id="symbol-front-grid"></div>

    </div>
    <div class="field">
      <label>Back</label>
      <div class="symbols-toggle" onclick="toggleSymbols('back')">
        <svg viewBox="0 0 14 14" fill="none" width="12" height="12"><path d="M2 4h10M2 7h6M2 10h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Symbols
      </div>
      <div class="symbol-palette" id="symbol-back">
        <div class="symbol-cats" id="symbol-back-cats"></div>
        <div class="symbol-grid" id="symbol-back-grid"></div>

      <textarea id="card-back" placeholder="Answer or definition…"></textarea>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('card-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Add Card</button>

  </div>
</div>

<!-- FOLDER MODAL -->
<div class="modal-overlay" id="folder-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h2 class="modal-title">New Folder</h2>
      <button class="modal-close" onclick="closeModal('folder-modal')">✕</button>
    </div>
    <div class="field">
      <label>Folder Name</label>
      <input type="text" id="folder-name-input" placeholder="e.g. Science">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('folder-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveFolder()">Create Folder</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA STORE (localStorage) =====
const DB_KEY = 'slate_db';

function loadDB() {
  try {
    return JSON.parse(localStorage.getItem(DB_KEY)) || { users: {}, sessions: {} };
  } catch { return { users: {}, sessions: {} }; }
}

function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function getCurrentUser() {
  const uid = localStorage.getItem('slate_uid');
  if (!uid) return null;
  const db = loadDB();
  return db.users[uid] || null;
}

function getUserData(uid) {
  const db = loadDB();
  if (!db.users[uid].decks) db.users[uid].decks = {};
  if (!db.users[uid].folders) db.users[uid].folders = {};
  return db.users[uid];
}

function saveUserData(uid, data) {
  const db = loadDB();
  db.users[uid] = { ...db.users[uid], ...data };
  saveDB(db);
}

// ===== AUTH =====
let isSignUp = false;

function toggleAuth() {
  isSignUp = !isSignUp;
  document.getElementById('auth-title').textContent = isSignUp ? 'Create account' : 'Welcome back';
  document.getElementById('auth-sub').textContent = isSignUp
    ? 'Join Slate and start studying smarter.'
    : 'Sign in to access your flashcards on any device.';
  document.getElementById('auth-submit').textContent = isSignUp ? 'Create account' : 'Sign in';
  document.getElementById('auth-switch').innerHTML = isSignUp
    ? 'Already have an account? <a onclick="toggleAuth()">Sign in</a>'
    : 'New here? <a onclick="toggleAuth()">Create an account</a>';
  document.getElementById('auth-name-field').style.display = isSignUp ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}

function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!email || !password) { showError('Please fill in all fields.'); return; }
  if (!email.includes('@')) { showError('Enter a valid email.'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

  const db = loadDB();
  const uid = btoa(email).replace(/=/g,'');

  if (isSignUp) {
    const name = document.getElementById('auth-name').value.trim() || email.split('@')[0];
    if (db.users[uid]) { showError('An account with this email already exists.'); return; }
    db.users[uid] = { uid, name, email, password, decks: {}, folders: {} };
    saveDB(db);
    localStorage.setItem('slate_uid', uid);
    launchApp(db.users[uid]);
  } else {
    const user = db.users[uid];
    if (!user) { showError('No account found with this email.'); return; }
    if (user.password !== password) { showError('Incorrect password.'); return; }
    localStorage.setItem('slate_uid', uid);
    launchApp(user);
  }

  function showError(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
}

document.getElementById('auth-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAuth();
});

// ===== APP =====
let currentUser = null;
let currentView = 'all'; // 'all' | 'folder:{id}' | 'deck:{id}' | 'study:{id}'
let editingDeckId = null;
let editingCardId = null;
let selectedColor = 'blue';
let activeSymbolField = null;
let studyDeckId = null;
let studyCards = [];
let studyIndex = 0;
let studyCorrect = 0;
let studyIncorrect = 0;
let cardFlipped = false;
let activeFolderForDeck = null;

const COLORS = {
  blue: '#0a84ff', green: '#30d158', purple: '#bf5af2',
  orange: '#ff9f0a', pink: '#ff375f', teal: '#5ac8fa'
};

const SYMBOLS = {
  'Math': ['π', 'Σ', '√', '∞', '≠', '≤', '≥', '±', '×', '÷', '∂', '∫', '∑', '∏', '∆', '∇', '⊕', '⊗', '∈', '∉', '⊂', '⊃', '∪', '∩', '∀', '∃', '→', '⟺', '⌀', 'ℝ', 'ℤ', 'ℕ', '⌈', '⌉', '⌊', '⌋'],
  'Greek': ['α', 'β', 'γ', 'δ', 'ε', 'ζ', 'η', 'θ', 'ι', 'κ', 'λ', 'μ', 'ν', 'ξ', 'ο', 'π', 'ρ', 'σ', 'τ', 'υ', 'φ', 'χ', 'ψ', 'ω', 'Α', 'Β', 'Γ', 'Δ', 'Ε', 'Λ', 'Φ', 'Ψ', 'Ω'],
  'Physics': ['ℏ', '℃', '℉', 'Ω', 'μ', 'ρ', 'σ', 'τ', 'λ', '∇', '⊥', '∥', '≈', '∝', '⟨', '⟩', 'ℓ', '∮', 'Å', 'ħ'],
  'Chem': ['→', '⇌', '⟶', '↔', '△', '⊕', '·', '°', '¹', '²', '³', '⁴', '⁺', '⁻', '₁', '₂', '₃', '₄', '₀'],
  'Logic': ['∧', '∨', '¬', '⊤', '⊥', '⊢', '⊨', '∴', '∵', '⟹', '⟺', '↑', '↓', '↕'],
  'Arrows': ['→', '←', '↑', '↓', '↔', '↕', '⇒', '⇐', '⇑', '⇓', '⇔', '↗', '↘', '↙', '↖', '↺', '↻', '⟵', '⟶', '⟷']
};

function launchApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.opacity = '0';
  document.getElementById('auth-screen').style.transform = 'scale(1.02)';
  setTimeout(() => {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  }, 380);
}

function initApp() {
  const uid = currentUser.uid;
  const initials = currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('user-avatar-sidebar').textContent = initials;
  document.getElementById('user-name-sidebar').textContent = currentUser.name;
  document.getElementById('user-email-sidebar').textContent = currentUser.email;
  renderFolders();
  renderDecks();
}

function signOut() {
  localStorage.removeItem('slate_uid');
  location.reload();
}

// ===== NAVIGATION =====
function navigateTo(view, folderId) {
  currentView = folderId ? `folder:${folderId}` : view;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  if (view === 'all') {
    document.getElementById('nav-all')?.classList.add('active');
  } else if (folderId) {
    document.getElementById(`folder-nav-${folderId}`)?.classList.add('active');
  }
  renderDecks(folderId);
}

// ===== RENDER =====
function renderFolders() {
  const user = getUserData(currentUser.uid);
  const list = document.getElementById('folder-list');
  const folders = Object.values(user.folders || {});

  list.innerHTML = folders.map(f => `
    <div class="sidebar-item" id="folder-nav-${f.id}" onclick="navigateTo('folder', '${f.id}')">
      <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M1 4a1 1 0 011-1h4l1.5 2H14a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      <span class="sidebar-folder-name">${f.name}</span>
    </div>
  `).join('');
}

function renderDecks(filterFolder) {
  const user = getUserData(currentUser.uid);
  const decks = Object.values(user.decks || {});
  const filtered = filterFolder ? decks.filter(d => d.folderId === filterFolder) : decks;

  let folderName = 'All Decks';
  if (filterFolder) {
    const f = (user.folders || {})[filterFolder];
    folderName = f ? f.name : 'Folder';
  }

  const html = `
    <div class="main-header animate-in">
      <div>
        <div class="main-title">${folderName}</div>
        <div class="main-subtitle">${filtered.length} deck${filtered.length !== 1 ? 's' : ''}</div>
      </div>
      <button class="btn btn-primary" onclick="openNewDeckModal(${filterFolder ? `'${filterFolder}'` : ''})">
        <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Deck
      </button>
    </div>
    ${filtered.length === 0 ? `
      <div class="empty-state animate-in">
        <div class="empty-icon">
          <svg viewBox="0 0 28 28" fill="none" width="28" height="28"><rect x="3" y="3" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="15" y="3" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5" opacity="0.5"/><rect x="3" y="15" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5" opacity="0.5"/><rect x="15" y="15" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5" opacity="0.3"/></svg>
        </div>
        <div class="empty-title">No decks yet</div>
        <div class="empty-sub">Create your first deck to start studying.</div>
        <button class="btn btn-primary" onclick="openNewDeckModal(${filterFolder ? `'${filterFolder}'` : ''})">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New Deck
        </button>
      </div>
    ` : `
      <div class="deck-grid animate-in">
        ${filtered.map(deck => {
          const count = Object.keys(deck.cards || {}).length;
          const color = COLORS[deck.color] || COLORS.blue;
          return `
            <div class="deck-card" onclick="openDeck('${deck.id}')">
              <div class="deck-card-color" style="background:${color}"></div>
              <div class="deck-card-name">${esc(deck.name)}</div>
              <div class="deck-card-desc">${esc(deck.desc || '')}</div>
              <div class="deck-card-meta">
                <span class="deck-card-count">${count} card${count !== 1 ? 's' : ''}</span>
                <div style="display:flex;gap:6px;align-items:center">
                  <div class="deck-card-actions">
                    <button class="icon-btn" onclick="event.stopPropagation();openEditDeck('${deck.id}')" title="Edit">
                      <svg viewBox="0 0 13 13" fill="none"><path d="M9.5 1.5l2 2-7 7H2.5v-2l7-7z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="icon-btn danger" onclick="event.stopPropagation();deleteDeck('${deck.id}')" title="Delete">
                      <svg viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M4.5 3.5V2h4v1.5M5.5 6v4M7.5 6v4M3 3.5l.7 7h5.6l.7-7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <button class="study-btn-sm" onclick="event.stopPropagation();startStudy('${deck.id}')">
                    <svg viewBox="0 0 11 11" fill="none"><path d="M2 1.5l7 4-7 4v-8z" fill="currentColor"/></svg>
                    Study
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  document.getElementById('main-content').innerHTML = html;
}

function openDeck(deckId) {
  const user = getUserData(currentUser.uid);
  const deck = user.decks[deckId];
  if (!deck) return;
  const cards = Object.values(deck.cards || {});

  const html = `
    <div class="main-header animate-in">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost" onclick="navigateTo('all')" style="padding:8px 10px">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div>
          <div class="main-title">${esc(deck.name)}</div>
          <div class="main-subtitle">${cards.length} card${cards.length !== 1 ? 's' : ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" onclick="openAddCard('${deckId}')">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Card
        </button>
        <button class="btn btn-primary" onclick="startStudy('${deckId}')">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M3 2l8 5-8 5V2z" fill="currentColor"/></svg>
          Study
        </button>
      </div>
    </div>
    <div class="cards-view animate-in">
      ${cards.length === 0 ? `
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 28 28" fill="none" width="28" height="28"><rect x="4" y="6" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M14 10v8M10 14h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

          <div class="empty-title">No cards yet</div>
          <div class="empty-sub">Add your first card to get started.</div>
          <button class="btn btn-primary" onclick="openAddCard('${deckId}')">Add Card</button>

        <div class="card-item">

            <div class="card-item-text">${esc(card.front)}</div>
          </div>
          <div class="card-item-back">
            <div class="card-item-label">Back</div>
            <div class="card-item-text">${esc(card.back)}</div>
          </div>
          <div class="card-item-actions">
            <button class="icon-btn" onclick="openEditCard('${deckId}','${card.id}')" title="Edit">
              <svg viewBox="0 0 13 13" fill="none"><path d="M9.5 1.5l2 2-7 7H2.5v-2l7-7z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn danger" onclick="deleteCard('${deckId}','${card.id}')" title="Delete">
              <svg viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M4.5 3.5V2h4v1.5M5.5 6v4M7.5 6v4M3 3.5l.7 7h5.6l.7-7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
}

// ===== STUDY =====
function startStudy(deckId) {
  const user = getUserData(currentUser.uid);
  const deck = user.decks[deckId];
  if (!deck) return;
  studyCards = Object.values(deck.cards || {});
  if (studyCards.length === 0) { showToast('Add some cards first!'); return; }

  // Shuffle
  for (let i = studyCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [studyCards[i], studyCards[j]] = [studyCards[j], studyCards[i]];
  }

  studyDeckId = deckId;
  studyIndex = 0;
  studyCorrect = 0;
  studyIncorrect = 0;
  cardFlipped = false;
  renderStudy(deck.name);
}

function renderStudy(deckName) {
  if (studyIndex >= studyCards.length) {
    renderStudyComplete(deckName);
    return;
  }

  const card = studyCards[studyIndex];
  const pct = Math.round((studyIndex / studyCards.length) * 100);

  const html = `
    <div class="study-header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost" onclick="navigateTo('all')" style="padding:8px 10px">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span style="font-size:15px;font-weight:600">${esc(deckName)}</span>
      </div>
      <div class="study-progress">
        <span class="progress-text">${studyIndex + 1} / ${studyCards.length}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span style="font-size:12px;color:var(--green)">${studyCorrect} ✓</span>
      </div>
    </div>
    <div class="study-view animate-in">
      <div class="flashcard-wrap">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-text">${esc(card.front)}</div>
            <div class="flashcard-hint">Tap to reveal answer</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-text">${esc(card.back)}</div>
            <div class="flashcard-label">Back</div>
          </div>
        </div>
      </div>
      <div class="study-actions">
        <button class="study-btn study-btn-incorrect" onclick="markCard(false)">
          <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Incorrect
        </button>
        <button class="study-btn study-btn-correct" onclick="markCard(true)">
          <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M2.5 8.5l4 4 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Correct
        </button>
      </div>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
  cardFlipped = false;
}

function flipCard() {
  const card = document.getElementById('flashcard');
  if (!card) return;
  cardFlipped = !cardFlipped;
  card.classList.toggle('flipped', cardFlipped);
}

function markCard(correct) {
  if (correct) studyCorrect++; else studyIncorrect++;
  studyIndex++;
  const user = getUserData(currentUser.uid);
  const deck = user.decks[studyDeckId];
  renderStudy(deck ? deck.name : 'Study');
}

function renderStudyComplete(deckName) {
  const html = `
    <div class="study-header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost" onclick="navigateTo('all')" style="padding:8px 10px">
          <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span style="font-size:15px;font-weight:600">${esc(deckName)}</span>
      </div>
    </div>
    <div class="study-view animate-in">
      <div class="study-complete">
        <div class="study-complete-emoji">🎉</div>
        <div class="study-complete-title">Session Complete!</div>
        <div class="study-complete-sub">You went through all ${studyCards.length} cards.</div>
        <div class="study-stats">
          <div class="stat-pill stat-pill-correct">
            <div class="stat-num" style="color:var(--green)">${studyCorrect}</div>
            <div class="stat-label">Correct</div>
          </div>
          <div class="stat-pill stat-pill-incorrect">
            <div class="stat-num" style="color:var(--red)">${studyIncorrect}</div>
            <div class="stat-label">Incorrect</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-secondary" onclick="navigateTo('all')">Back to Library</button>
          <button class="btn btn-primary" onclick="startStudy('${studyDeckId}')">Study Again</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('main-content').innerHTML = html;
}

// ===== DECK CRUD =====
function openNewDeckModal(folderId) {
  editingDeckId = null;
  activeFolderForDeck = folderId || null;
  document.getElementById('deck-modal-title').textContent = 'New Deck';
  document.getElementById('deck-name-input').value = '';
  document.getElementById('deck-desc-input').value = '';
  pickColorById('blue');
  openModal('deck-modal');
  setTimeout(() => document.getElementById('deck-name-input').focus(), 100);
}

function openEditDeck(deckId) {
  const user = getUserData(currentUser.uid);
  const deck = user.decks[deckId];
  if (!deck) return;
  editingDeckId = deckId;
  document.getElementById('deck-modal-title').textContent = 'Edit Deck';
  document.getElementById('deck-name-input').value = deck.name;
  document.getElementById('deck-desc-input').value = deck.desc || '';
  pickColorById(deck.color || 'blue');
  openModal('deck-modal');
}

function saveDeck() {
  const name = document.getElementById('deck-name-input').value.trim();
  if (!name) { showToast('Please enter a deck name.'); return; }

  const user = getUserData(currentUser.uid);
  const uid = currentUser.uid;
  const db = loadDB();

  if (editingDeckId) {
    db.users[uid].decks[editingDeckId].name = name;
    db.users[uid].decks[editingDeckId].desc = document.getElementById('deck-desc-input').value.trim();
    db.users[uid].decks[editingDeckId].color = selectedColor;
    saveDB(db);
    showToast('Deck updated.');
  } else {
    const id = 'deck_' + Date.now();
    if (!db.users[uid].decks) db.users[uid].decks = {};
    db.users[uid].decks[id] = {
      id, name,
      desc: document.getElementById('deck-desc-input').value.trim(),
      color: selectedColor,
      folderId: activeFolderForDeck || null,
      cards: {},
      created: Date.now()
    };
    saveDB(db);
    showToast('Deck created!');
  }

  closeModal('deck-modal');
  renderDecks();
}

function deleteDeck(deckId) {
  if (!confirm('Delete this deck and all its cards?')) return;
  const uid = currentUser.uid;
  const db = loadDB();
  delete db.users[uid].decks[deckId];
  saveDB(db);
  showToast('Deck deleted.');
  renderDecks();
}

// ===== CARD CRUD =====
function openAddCard(deckId) {
  editingCardId = null;
  editingDeckId = deckId;
  document.getElementById('card-modal-title').textContent = 'Add Card';
  document.getElementById('card-front').value = '';
  document.getElementById('card-back').value = '';
  document.querySelectorAll('.symbol-palette').forEach(p => p.classList.remove('open'));
  openModal('card-modal');
  initSymbolPalettes();
  setTimeout(() => document.getElementById('card-front').focus(), 100);
}

function openEditCard(deckId, cardId) {
  const user = getUserData(currentUser.uid);
  const card = user.decks[deckId]?.cards[cardId];
  if (!card) return;
  editingCardId = cardId;
  editingDeckId = deckId;
  document.getElementById('card-modal-title').textContent = 'Edit Card';
  document.getElementById('card-front').value = card.front;
  document.getElementById('card-back').value = card.back;
  document.querySelectorAll('.symbol-palette').forEach(p => p.classList.remove('open'));
  openModal('card-modal');
  initSymbolPalettes();
}

function saveCard() {
  const front = document.getElementById('card-front').value.trim();
  const back = document.getElementById('card-back').value.trim();
  if (!front || !back) { showToast('Please fill in both sides.'); return; }

  const uid = currentUser.uid;
  const db = loadDB();

  if (!db.users[uid].decks[editingDeckId].cards) db.users[uid].decks[editingDeckId].cards = {};

  if (editingCardId) {
    db.users[uid].decks[editingDeckId].cards[editingCardId].front = front;
    db.users[uid].decks[editingDeckId].cards[editingCardId].back = back;
    showToast('Card updated.');
  } else {
    const id = 'card_' + Date.now();
    db.users[uid].decks[editingDeckId].cards[id] = { id, front, back, created: Date.now() };
    showToast('Card added!');
  }

  saveDB(db);
  closeModal('card-modal');
  openDeck(editingDeckId);
}

function deleteCard(deckId, cardId) {
  if (!confirm('Delete this card?')) return;
  const uid = currentUser.uid;
  const db = loadDB();
  delete db.users[uid].decks[deckId].cards[cardId];
  saveDB(db);
  showToast('Card deleted.');
  openDeck(deckId);
}

// ===== FOLDERS =====
function openNewFolderModal() {
  document.getElementById('folder-name-input').value = '';
  openModal('folder-modal');
  setTimeout(() => document.getElementById('folder-name-input').focus(), 100);
}

function saveFolder() {
  const name = document.getElementById('folder-name-input').value.trim();
  if (!name) { showToast('Please enter a folder name.'); return; }

  const uid = currentUser.uid;
  const db = loadDB();
  if (!db.users[uid].folders) db.users[uid].folders = {};
  const id = 'folder_' + Date.now();
  db.users[uid].folders[id] = { id, name };
  saveDB(db);
  closeModal('folder-modal');
  renderFolders();
  showToast('Folder created!');
}

// ===== SYMBOLS =====
let symCatState = { front: 'Math', back: 'Math' };

function initSymbolPalettes() {
  ['front', 'back'].forEach(side => {
    renderSymbolCats(side);
    renderSymbolGrid(side, symCatState[side]);
  });
}

function renderSymbolCats(side) {
  const container = document.getElementById(`symbol-${side}-cats`);
  container.innerHTML = Object.keys(SYMBOLS).map(cat => `
    <button class="symbol-cat-btn ${symCatState[side] === cat ? 'active' : ''}"
      onclick="selectSymCat('${side}','${cat}')">${cat}</button>
  `).join('');
}

function selectSymCat(side, cat) {
  symCatState[side] = cat;
  renderSymbolCats(side);
  renderSymbolGrid(side, cat);
}

function renderSymbolGrid(side, cat) {
  const grid = document.getElementById(`symbol-${side}-grid`);
  const syms = SYMBOLS[cat] || [];
  grid.innerHTML = syms.map(s => `
    <button class="symbol-btn" onclick="insertSymbol('${side}','${s}')" title="${s}">${s}</button>
  `).join('');
}

function insertSymbol(side, sym) {
  const ta = document.getElementById(`card-${side}`);
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + sym + ta.value.slice(end);
  ta.focus();
  ta.setSelectionRange(start + sym.length, start + sym.length);
}

function toggleSymbols(side) {
  const el = document.getElementById(`symbol-${side}`);
  el.classList.toggle('open');
}

// ===== COLOR PICKER =====
function pickColor(el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.style.outline = '3px solid transparent');
  el.style.outline = '3px solid ' + el.style.background;
  selectedColor = el.dataset.color;
}

function pickColorById(colorId) {
  selectedColor = colorId;
  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach(s => {
    s.style.outline = s.dataset.color === colorId ? '3px solid ' + s.style.background : '3px solid transparent';
  });
}

// ===== MODAL UTILS =====
function openModal(id) {
  document.getElementById(id).classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
  }
  if (e.key === ' ' && document.getElementById('flashcard')) {
    e.preventDefault();
    flipCard();
  }
});

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== UTILS =====
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
