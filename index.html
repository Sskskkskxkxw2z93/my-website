<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate | Flashcards</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(28, 28, 30, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-blue: #0A84FF;
            --accent-red: #FF453A;
            --accent-green: #30D158;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Auth Screen (Simplistic Apple Style) --- */
        #auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #000000 100%);
            z-index: 9999;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            padding: 40px;
            text-align: center;
        }

        .auth-card h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .auth-card p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            padding: 14px 16px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus { border-color: var(--accent-blue); }

        .primary-btn {
            width: 100%;
            background: var(--text-main);
            color: var(--bg-color);
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }

        .auth-toggle {
            margin-top: 24px;
            font-size: 14px;
            color: var(--accent-blue);
            cursor: pointer;
        }

        /* --- App Layout --- */
        #app-screen { display: none; width: 100%; height: 100%; flex-direction: row; }

        .sidebar {
            width: 280px;
            background: #000;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .sidebar-header span { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; }

        .deck-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 15px;
            color: #d1d1d6;
        }

        .deck-item:hover { background: rgba(255,255,255,0.05); }
        .deck-item.active { background: var(--accent-blue); color: white; }

        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .header-btns button {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
            cursor: pointer;
        }

        /* --- Editor & Palette --- */
        .symbol-palette {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        .sym-btn {
            background: #1c1c1e;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .editor-card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--panel-border);
        }

        .editor-card textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            resize: none;
            height: 120px;
            outline: none;
            margin-top: 10px;
        }

        /* --- Study Mode --- */
        .flashcard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-surface {
            width: 100%;
            max-width: 500px;
            height: 320px;
            background: #1c1c1e;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid var(--panel-border);
            position: relative;
        }

        .card-surface:active { transform: scale(0.98); }

        .card-surface .side-indicator {
            position: absolute;
            top: 24px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
        }

        .controls { display: flex; gap: 20px; margin-top: 40px; }
        .ctrl-btn {
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .fail { background: var(--accent-red); color: white; }
        .pass { background: var(--accent-green); color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 id="auth-title">Slate</h1>
            <p id="auth-sub">Sign in to sync your library.</p>
            <input type="email" id="email" class="input-field" placeholder="Email" autocomplete="email">
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button class="primary-btn" id="auth-main-btn">Sign In</button>
            <div class="auth-toggle" id="auth-toggle-btn">Create an account</div>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>DECKS</span>
                <button id="add-deck-btn" style="background:none; border:none; color:var(--accent-blue); font-size:20px; cursor:pointer;">+</button>
            </div>
            <div id="deck-list" style="flex:1"></div>
            <button id="logout-btn" style="background:none; border:none; color:var(--accent-red); text-align:left; padding:10px; cursor:pointer; font-size:14px;">Sign Out</button>
        </div>

        <div class="main-content">
            <div class="top-nav">
                <h2 id="view-title">Select a deck</h2>
                <div class="header-btns hidden" id="action-btns">
                    <button id="go-add-btn">Add Card</button>
                    <button id="go-study-btn" style="background:var(--accent-blue)">Study</button>
                </div>
            </div>

            <div id="view-add" class="hidden">
                <div class="symbol-palette" id="palette"></div>
                <div class="editor-card">
                    <span style="font-size:11px; color:var(--text-muted); font-weight:700">FRONT</span>
                    <textarea id="front-in" placeholder="Formula or Question..."></textarea>
                    <div style="height:1px; background:var(--panel-border); margin: 20px 0;"></div>
                    <span style="font-size:11px; color:var(--text-muted); font-weight:700">BACK</span>
                    <textarea id="back-in" placeholder="Answer..."></textarea>
                </div>
                <button class="primary-btn" id="save-card-trigger" style="width:200px; align-self:flex-end">Save Card</button>
            </div>

            <div id="view-study" class="hidden flashcard-container">
                <div class="card-surface" id="flashcard">
                    <span class="side-indicator" id="side-tag">FRONT</span>
                    <div id="card-text">Loading...</div>
                </div>
                <div class="controls hidden" id="study-ctrls">
                    <button class="ctrl-btn fail" id="btn-wrong">Again</button>
                    <button class="ctrl-btn pass" id="btn-right">Got it</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLn5hL02geNL0eMU5xXXUKkrLKA0QZhfs",
            authDomain: "slate-app-8fc4c.firebaseapp.com",
            projectId: "slate-app-8fc4c",
            storageBucket: "slate-app-8fc4c.firebasestorage.app",
            messagingSenderId: "1038552772007",
            appId: "1:1038552772007:web:855420f4f2181952cc9a82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userDecks = [];
        let currentDeckId = null;
        let deckCards = [];
        let studyIdx = 0;
        let isFront = true;
        let isLogin = true;

        // --- Auth Logic ---
        const authToggle = document.getElementById('auth-toggle-btn');
        const authBtn = document.getElementById('auth-main-btn');

        authToggle.onclick = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Slate" : "Join Slate";
            authBtn.innerText = isLogin ? "Sign In" : "Create Account";
            authToggle.innerText = isLogin ? "Create an account" : "Already have an account?";
        };

        authBtn.onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if(!email || !pass) return alert("Fields cannot be empty");

            try {
                if(isLogin) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // --- App Logic ---
        function initApp() {
            const q = query(collection(db, `users/${auth.currentUser.uid}/decks`), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('deck-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const el = document.createElement('div');
                    el.className = "deck-item";
                    el.innerText = d.name;
                    el.onclick = () => loadDeck(doc.id, d.name);
                    list.appendChild(el);
                });
            });
            initPalette();
        }

        document.getElementById('add-deck-btn').onclick = async () => {
            const n = prompt("Deck name:");
            if(n) await addDoc(collection(db, `users/${auth.currentUser.uid}/decks`), { name: n, createdAt: Date.now() });
        };

        function loadDeck(id, name) {
            currentDeckId = id;
            document.getElementById('view-title').innerText = name;
            document.getElementById('action-btns').classList.remove('hidden');
            showView('view-add');
            
            onSnapshot(collection(db, `users/${auth.currentUser.uid}/decks/${id}/cards`), snap => {
                deckCards = snap.docs.map(d => d.data());
            });
        }

        function showView(id) {
            ['view-add', 'view-study'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Palette
        function initPalette() {
            const syms = ['π','√','∞','θ','λ','Σ','Δ','∫','≈','≠','±','→'];
            const p = document.getElementById('palette');
            p.innerHTML = "";
            syms.forEach(s => {
                const b = document.createElement('button');
                b.className = "sym-btn";
                b.innerText = s;
                b.onclick = () => {
                    const target = document.activeElement.tagName === 'TEXTAREA' ? document.activeElement : document.getElementById('front-in');
                    target.value += s;
                    target.focus();
                };
                p.appendChild(b);
            });
        }

        // Card Saving
        document.getElementById('save-card-trigger').onclick = async () => {
            const f = document.getElementById('front-in').value;
            const b = document.getElementById('back-in').value;
            if(!f || !b) return;
            await addDoc(collection(db, `users/${auth.currentUser.uid}/decks/${currentDeckId}/cards`), { front: f, back: b });
            document.getElementById('front-in').value = "";
            document.getElementById('back-in').value = "";
        };

        // Study Mode
        document.getElementById('go-study-btn').onclick = () => {
            if(deckCards.length === 0) return alert("Add cards first!");
            studyIdx = 0;
            isFront = true;
            showView('view-study');
            renderCard();
        };

        document.getElementById('go-add-btn').onclick = () => showView('view-add');

        function renderCard() {
            if(studyIdx >= deckCards.length) {
                document.getElementById('card-text').innerText = "All caught up!";
                document.getElementById('study-ctrls').classList.add('hidden');
                return;
            }
            isFront = true;
            document.getElementById('side-tag').innerText = "FRONT";
            document.getElementById('card-text').innerText = deckCards[studyIdx].front;
            document.getElementById('study-ctrls').classList.add('hidden');
        }

        document.getElementById('flashcard').onclick = () => {
            if(!isFront || studyIdx >= deckCards.length) return;
            isFront = false;
            document.getElementById('side-tag').innerText = "BACK";
            document.getElementById('card-text').innerText = deckCards[studyIdx].back;
            document.getElementById('study-ctrls').classList.remove('hidden');
        };

        document.getElementById('btn-wrong').onclick = () => { studyIdx++; renderCard(); };
        document.getElementById('btn-right').onclick = () => { studyIdx++; renderCard(); };

    </script>
</body>
</html>
